# Builds the Android app (Capacitor) and publishes the signed APK as a GitHub Release.
# Runs when the version changes (sw.js holds it) or by hand from the Actions tab.
name: APK Android

on:
  push:
    branches: [main]
    paths: [sw.js, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Version
        run: echo "V=$(grep -o "expy-v[0-9]*\.[0-9]*\.[0-9]*" sw.js | head -1 | sed 's/expy-v//')" >> "$GITHUB_ENV"

      - name: Web app into the Android project
        run: |
          npm ci
          npm run sync

      - name: Signing key
        env:
          KS: ${{ secrets.EXPY_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Secret EXPY_KEYSTORE_B64 manquant (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/expy.jks"
          echo "EXPY_KEYSTORE=$RUNNER_TEMP/expy.jks" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          EXPY_KEYSTORE_PASS: ${{ secrets.EXPY_KEYSTORE_PASS }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/expy-$V.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.V }}
          name: Expy ${{ env.V }}
          body: |
            Expy ${{ env.V }} pour Android. Sur le téléphone : touche le fichier .apk ci-dessous, puis Installer.
          files: expy-${{ env.V }}.apk
          make_latest: true
