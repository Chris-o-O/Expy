/* Lists */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }

.tag.prio { background: var(--fg); color: var(--bg); }

.empty .link { display: inline; }

.stack > li { border-radius: 24px; overflow: hidden; color: #0A0A0A; --fg: #0A0A0A; --muted: #4A4A4A; --ok: #0E6B38; --bad: #B3261E; --line: rgba(10,10,10,.14); --bg: #fff; }
.stack > li:nth-child(6n+1) { background: var(--p1); }
.stack > li:nth-child(6n+2) { background: var(--p2); }
.stack > li:nth-child(6n+3) { background: var(--p3); }
.stack > li:nth-child(6n+4) { background: var(--p4); }
.stack > li:nth-child(6n+5) { background: var(--p5); }
.stack > li:nth-child(6n+6) { background: var(--p6); }
.stack .tag.prio { background: #0A0A0A; color: #fff; }
.stack .tag.ex { border-color: #4A4A4A; }
.meter { height: 8px; border-radius: 999px; background: rgba(10,10,10,.14); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: #0A0A0A; }

/* Sharing */
.split-row { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
/* v1.15: "maison", "partagé", note/date only while an expense is being entered (keyboard open or an amount typed).
   With the in-app keypad their space is kept so the keys never move under the finger. */
#v-home:not(.typing) .opts-row, #v-home:not(.typing) .split-row, #v-home:not(.typing) .nat-add { display: none; }

.sp-k { font-size: 12px; font-weight: 700; color: var(--muted); flex: none; min-width: 58px; }
.chip.sm { padding: 5px 12px; font-size: 13.5px; }
.tag.share { color: var(--accent); border: 1px solid var(--accent); }
.toggle.sm { padding: 5px 12px 5px 8px; }
/* Dashboard + goals */
.dline { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; margin-top: 8px; font-size: 13.5px; font-weight: 700; width: 100%; }
.dline .d { grid-column: 1 / -1; font-size: 12px; font-weight: 600; color: var(--muted); }

.catrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--line); }

.ico-btn { border: 0; padding: 0; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 8px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: min(488px, calc(100% - 32px)); background: var(--fg); color: var(--bg); border-radius: 20px; padding: 12px 14px 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.alert { background: var(--bad); color: #fff; }

.toast button { border: 0; background: transparent; color: inherit; font-weight: 800; text-decoration: underline; text-underline-offset: 3px; padding: 4px; flex: none; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(8,10,14,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet-panel { background: var(--bg); width: 100%; max-width: 520px; border-radius: 28px 28px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

(() => {
'use strict';

/* ---------- Utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => String(n).padStart(2, '0');
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const CUR = new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD' });
const CUR0 = new Intl.NumberFormat('fr-CA', { style: 'currency', currency: 'CAD', maximumFractionDigits: 0 });
const PCT = new Intl.NumberFormat('fr-CA', { style: 'percent', maximumFractionDigits: 0 });
const money = (c) => CUR.format((c || 0) / 100);
const money0 = (c) => CUR0.format(Math.round((c || 0) / 100));
const monthKey = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1);
const curMonth = () => monthKey(new Date());
const parseMonth = (k) => { const [y, m] = k.split('-').map(Number); return new Date(y, m - 1, 1); };
const addMonths = (k, n) => { const d = parseMonth(k); d.setMonth(d.getMonth() + n); return monthKey(d); };
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const monthLabel = (k, withYear = true) => {
  const s = parseMonth(k).toLocaleDateString('fr-CA', withYear ? { month: 'long', year: 'numeric' } : { month: 'long' });
  return s;

    const rows = plan.rows.map(({ w, when, state }) => {
      const cov = Math.max(0, Math.min(1, ((s.wishCushion || 0) - cum) / w.price)); cum += w.price;
      let t = 0;
      if (state === 'now') t = 1;
      else if (state === 'date' && w.added && when > w.added) t = Math.max(0, Math.min(1, daysBetween(w.added, today) / daysBetween(w.added, when)));
      const p = Math.round(Math.max(cov, t) * 100); wsum += p * w.price; wtot += w.price;
      return { n: w.name, p, d: state === 'now' ? 'Possible maintenant' : state === 'date' ? `Vers le ${shortDate(when, true)}` : state === 'never' ? 'Pas atteignable au rythme actuel' : 'Date à estimer' };
    });

/* ---------- Profil : paie, charges fixes, comptes, répartition ---------- */
const PAY_FREQ = { biweekly: ['Aux 2 semaines', 26], semimonthly: ['2 fois par mois', 24], monthly: ['1 fois par mois', 12], weekly: ['Chaque semaine', 52] };
const perPay = (monthly, freq) => Math.round(monthly * 12 / PAY_FREQ[freq][1]);
const perMonth = (pp, freq) => Math.round(pp * PAY_FREQ[freq][1] / 12);
const pfListPP = (pf) => perPay(pf.fixedItems.reduce((a, i) => a + i.amt, 0), pf.freq);
const pfFixed = (pf) => (pf.common ? pf.fixedCommon : 0) + pfListPP(pf);
const pfSpend = (pf) => pf.pay - pfFixed(pf) - pf.save - pf.debt;
function payDatesIn(pf, y, m) {
  const last = new Date(y, m + 1, 0).getDate(), mk = (d) => isoOf(new Date(y, m, Math.min(d, last)));
  if (pf.freq === 'monthly') return [mk(+pf.next.slice(8, 10))];
  return pf.semi === '1-15' ? [mk(1), mk(15)] : [mk(15), mk(last)];
}
// The pay period containing `day`: from a pay date to the day before the next one.
function payPeriodAt(pf, day) {
  if (pf.freq === 'weekly' || pf.freq === 'biweekly') {
    const L = pf.freq === 'weekly' ? 7 : 14, start = addDays(pf.next, Math.floor(daysBetween(pf.next, day) / L) * L);
    return { start, end: addDays(start, L - 1) };
  }
  const d = dateOf(day), ds = [];
  for (let i = -1; i <= 1; i++) { const x = new Date(d.getFullYear(), d.getMonth() + i, 1); ds.push(...payDatesIn(pf, x.getFullYear(), x.getMonth())); }
  ds.sort();
  return { start: ds.filter(x => x <= day).pop(), end: addDays(ds.find(x => x > day), -1) };
}
// Per-pay amount the savings goals need to hit their dates.
function goalsNeedPerPay(freq) {
  const today = todayISO(), payDays = 365.25 / PAY_FREQ[freq][1];
  return Math.ceil(S.settings.goals.reduce((a, g) => {
    const rem = g.target - g.saved;
    return rem > 0 && g.by >= today ? a + rem / Math.max(1, (daysBetween(today, g.by) + 1) / payDays) : a;
  }, 0) / 100) * 100;
}
/* Savings benchmark (a rule of thumb, not advice): 10 % under 30, 15 % at 30-44, 20 % at 45-54, 25 % after;
   5 points less under 40 000 $ net a year, 5 more above 90 000 $; never under 5 %. Goals can raise it. */
function saveReco(pf) {
  const annual = pf.pay * PAY_FREQ[pf.freq][1] / 100;
  let rate = pf.age == null || pf.age < 30 ? 10 : pf.age < 45 ? 15 : pf.age < 55 ? 20 : 25;
  if (annual < 40000) rate -= 5; else if (annual > 90000) rate += 5;
  rate = Math.max(5, rate);
  const min = Math.ceil(pf.pay * rate / 10000) * 100, goals = goalsNeedPerPay(pf.freq);
  return { rate, min, goals, reco: Math.max(min, goals) };
}
function debtReco(pf) {
  const s = S.settings, act = s.debts.filter(d => d.bal > 0);
  if (!act.length) return null;
  const sumMin = act.reduce((a, d) => a + d.min, 0), need = debtNeedFor(s, s.debtGoalBy, 0);
  return { min: Math.ceil(perPay(sumMin, pf.freq) / 100) * 100, date: need ? Math.ceil(perPay(need, pf.freq) / 100) * 100 : null,
    hot: act.reduce((a, d) => Math.max(a, d.apr), 0) };
}

/* Confidence: can the real pattern (pay received, spending) fund the goals and the debt-free date?

  for (const l of lines) if (l.band) g += `<path d="M${pts(l.v.map((v, m) => v + pj.band[m])).join('L')}L${pts(l.v.map((v, m) => v - pj.band[m])).reverse().join('L')}Z" style="fill:${l.col}" fill-opacity=".14"/>`;
  for (const l of lines) g += `<path d="M${pts(l.v).join('L')}" fill="none" style="stroke:${l.col}" stroke-width="${l.w}" ${l.dash ? 'stroke-dasharray="7 5"' : ''} stroke-linecap="round" stroke-linejoin="round"/><text x="356" y="${(Y(l.v[12]) + 4).toFixed(1)}" style="fill:${l.col}" font-weight="800">${kmoney(l.v[12])}</text>`;
  return `<svg class="fchart" viewBox="0 0 410 256" role="img" aria-label="${mode === 'net' ? 'Valeur nette projetée sur 12 mois' : 'Soldes projetés par compte sur 12 mois'}">${g}</svg>`;
}

// Optional "debt-free by" date: shows the monthly budget it takes, interest included.
function debtByCard(sim) {
  const s = S.settings, by = s.debtGoalBy;
  let note = 'Choisis une date pour voir combien il faut rembourser par mois.', btn = '';
  if (by) {
    const extra = leftoverExtra(), need = debtNeedFor(s, by, extra);
    const k = (+by.slice(0, 4) * 12 + +by.slice(5, 7)) - (+curMonth().slice(0, 4) * 12 + +curMonth().slice(5, 7));
    if (need == null) note = 'Date trop proche pour tout rembourser.';
    else if (sim.months != null && sim.months <= k) note = `Ton budget suffit : libre en ${payoffLabel(sim.months)}. Le minimum pour ta date : ${money0(need)} par mois${extra ? ' (avec ton reste moyen)' : ''}.`;
    else { note = `Pour y arriver : ${money0(need)} par mois, intérêts compris${extra ? ' (avec ton reste moyen)' : ''}. Ton budget actuel : ${money0(s.debtBudget)}.`; btn = `<button class="btn" data-act="debt-use-need" data-v="${need}">Utiliser ${money0(need)} par mois</button>`; }

}
function budgetNoteText(v, sumMin) {

  if (S.settings.leftoverToDebt) {

  return t;
}

/* ---------- Stats view ---------- */
function renderStats() {
  const start = trackingStart(), startMk = start.slice(0, 7);
  if (UI.statsMonth < startMk) UI.statsMonth = startMk;
  if (UI.statsMonth > curMonth()) UI.statsMonth = curMonth();
  const mk = UI.statsMonth;
  const items = itemsOf(mk).slice().sort((a, b) => b.ts.localeCompare(a.ts));
  const total = sumC(items), homeC = sumC(items.filter(i => i.home));
  const isCur = mk === curMonth();
  const mFirst = mk + '-01', mLast = isoOf(new Date(parseMonth(mk).getFullYear(), parseMonth(mk).getMonth() + 1, 0));
  const from = start > mFirst ? start : mFirst, to = isCur ? todayISO() : mLast;
  const daysCounted = Math.max(1, daysBetween(from, to) + 1);
  // chart: up to six calendar months, never before the start of tracking
  const ks = []; for (let i = 5; i >= 0; i--) { const k = addMonths(mk, -i); if (k >= startMk) ks.push(k); }
  const vals = ks.map(k => sumC(itemsOf(k))), ths = ks.map(() => null);
  const maxV = Math.max(1, ...vals) * 1.1;
  const slots = Math.max(ks.length, 3);
  const W = 340, H = 170, padB = 36, padT = 8, bw = 34, gap = (W - 8 - bw * 6) / 5, padL = (W - (slots * bw + (slots - 1) * gap)) / 2;
  const y = (v) => padT + (H - padT - padB) * (1 - v / maxV);
  let svg = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total des six derniers mois">`;
  svg += `<line x1="0" x2="${W}" y1="${H - padB}" y2="${H - padB}" stroke="var(--line)" stroke-width="1"/>`;
  ks.forEach((k, i) => {
    const x = padL + i * (bw + gap), v = vals[i], t = ths[i];
    const over = t && v > t, cur = k === mk;
    const fill = over ? 'var(--bad)' : cur ? 'var(--accent)' : 'var(--muted)';
    const op = cur ? 1 : over ? .55 : .3;
    if (v > 0) svg += `<rect x="${x}" y="${y(v)}" width="${bw}" height="${H - padB - y(v)}" rx="4" fill="${fill}" opacity="${op}"/>`;
    if (t) svg += `<line x1="${x - 4}" x2="${x + bw + 4}" y1="${y(t)}" y2="${y(t)}" stroke="var(--fg)" stroke-width="1.5" stroke-dasharray="3 2" opacity=".6"/>`;
    const lbl = parseMonth(k).toLocaleDateString('fr-CA', { month: 'short' }).replace('.', '');
    const st = cur ? 'fill:var(--fg);font-weight:500' : '';
    svg += `<text x="${x + bw / 2}" y="${H - 21}" text-anchor="middle" style="${st}">${esc(lbl)}</text>`;
    svg += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" style="${over ? 'fill:var(--bad);' : ''}${st}">${v ? Math.round(v / 100) : '–'}</text>`;
  });
  svg += `</svg>`;
  // per category
  const byCat = {};
  for (const it of items) byCat[it.cat] = (byCat[it.cat] || 0) + it.amt;
  const catRows = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([id, v]) => {
    const c = catById(id);
    const scale = Math.max(v, c.limit || 0, ...Object.values(byCat));
    const lim = c.limit ? `<span class="lim ${v > c.limit ? 'over' : ''}">${v > c.limit ? 'Dépassé de ' + money(v - c.limit) + ' sur ' : 'Seuil '}${money0(c.limit)}</span>` : '';
    return `<div class="catrow"><span class="n"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:${esc(c.color)}"></span>${esc(c.name)}</span><span class="num" style="font-weight:650">${money(v)}</span>
      <span class="bar"><i style="width:${(v / scale) * 100}%;background:${esc(c.color)}"></i>${c.limit ? `<b style="left:calc(${(c.limit / scale) * 100}% - 1px)"></b>` : ''}</span>${lim}</div>`;
  }).join('');
  $('#v-stats').innerHTML = `
    <div class="month-nav"><button data-act="month" data-d="-1" aria-label="Mois précédent" ${mk <= startMk ? 'disabled' : ''}>‹</button><h1>${cap(monthLabel(mk))}</h1><button data-act="month" data-d="1" aria-label="Mois suivant" ${isCur ? 'disabled' : ''}>›</button></div>
    <div class="card hero">
      <div class="kv">
        <div><span class="k">Total</span><span class="v num">${money0(total)}</span></div>
        <div><span class="k">Par jour</span><span class="v num">${money0(total / daysCounted)}</span></div>
        <div><span class="k">Dépenses</span><span class="v num">${items.length}</span></div>
      </div>
    </div>
    <div class="card">
      ${svg}
      <div class="note">Total par mois civil, en $, depuis le début de ton suivi le ${esc(shortDate(start, true))}. Le seuil suit tes périodes, plus bas.</div>
    </div>
    ${periodsCard()}
    <div class="card peach">
      <h2 style="color:var(--home)">Faisable à la maison</h2>
      <div class="kv">
        <div><span class="k">Ce mois</span><span class="v num" style="color:var(--home)">${money0(homeC)}</span></div>
        <div><span class="k">Part</span><span class="v num">${total ? PCT.format(homeC / total) : '—'}</span></div>
        <div><span class="k">Sur 12 mois</span><span class="v num">${money0(homeC / daysCounted * 365)}</span></div>
      </div>
      <div class="note">Sans ces achats, le mois serait à ${money(total - homeC)}. L'estimation sur 12 mois prolonge le rythme quotidien de ce mois.</div>
    </div>

function periodStatus(p) {
  const t = sumC(itemsIn(p)), today = todayISO();
  const cur = p.start <= today && today <= p.end, future = p.start > today;
  let st;
  if (future) st = '<span class="muted">À venir</span>';
  else if (t > p.amount) st = `<span style="color:var(--bad);font-weight:600">Dépassé de ${money0(t - p.amount)}</span>`;
  else st = `<span style="color:var(--ok);font-weight:600">${cur ? 'Reste' : 'Sous le seuil de'} ${money0(p.amount - t)}</span>`;
  return { t, st, cur, future };
}
function periodsCard() {
  const today = todayISO();
  const ps = S.settings.periods.filter(p => p.start <= today).sort((a, b) => b.start.localeCompare(a.start)).slice(0, 8);
  if (!ps.length) return `<div class="card"><h2>Périodes de budget</h2><div class="note">Aucune période définie.</div><button class="btn ghost" data-act="period-new">Définir une période</button></div>`;

}

/* ---------- Wish list ---------- */
// Saving capacity = what stayed under the threshold in the last finished periods (up to 6), per day.
// A fixed monthly amount set by the user overrides it.
function autoLeftover() {
  const today = todayISO();
  const done = S.settings.periods.filter(p => p.end < today).sort((a, b) => b.end.localeCompare(a.end)).slice(0, 6);
  if (!done.length) return null;
  let left = 0, days = 0;
  for (const p of done) { left += p.amount - reserveFor(p).total - sumC(itemsIn(p)); days += periodLen(p); }
  const perDay = left / days;
  return { perDay, monthly: Math.round(perDay * 30.4375), n: done.length };
}
function savingRate() {
  const s = S.settings;
  if (s.wishRate != null) return { perDay: s.wishRate / 30.4375, monthly: s.wishRate, source: 'fixed' };
  const a = autoLeftover();
  if (!a) return { perDay: null, monthly: null, source: 'none' };
  return Object.assign({ source: 'auto' }, a);
}
// While debts remain and the leftover goes to them, the estimated savings only start after the debts.
const wishesWaitForDebts = () => { const s = S.settings; return s.wishAfterDebts || (s.leftoverToDebt && s.wishRate == null); };
// Wishes are funded in list order: each one waits for the ones above it.
function wishPlan() {
  const s = S.settings, r = savingRate();
  const hasDebt = s.debts.some(d => d.bal > 0);
  let startDay = todayISO(), debtMonths;
  if (wishesWaitForDebts() && hasDebt) {
    debtMonths = debtSim().months;
    if (debtMonths != null) { const d = parseMonth(addMonths(curMonth(), debtMonths)); startDay = isoOf(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  }
  let cum = 0;
  const rows = s.wishes.map(w => {
    cum += w.price;
    const need = cum - (s.wishCushion || 0);
    let when = null, state;
    if (need <= 0) state = 'now';
    else if (wishesWaitForDebts() && hasDebt && debtMonths == null) state = 'never';
    else if (r.source === 'none') state = 'unknown';
    else if (!(r.perDay > 0)) state = 'never';
    else { when = addDays(startDay, Math.ceil(need / r.perDay)); state = 'date'; }
    return { w, need, when, state };
  });
  return { r, rows, hasDebt, debtMonths };
}
function relLabel(iso) {
  const d = daysBetween(todayISO(), iso);
  if (d <= 1) return 'demain';
  if (d < 45) return `dans ${d} jours`;
  const m = Math.round(d / 30.4375);
  return m < 24 ? `dans ${m} mois` : `dans ${Math.round(m / 12)} ans`;
}
function renderWishes() {

  let head = goalsSeg('wishes') + `<div class="view-head"><h1>Souhaits</h1><button class="btn" data-act="wish-new">Ajouter</button></div>`;
  let rateV, src, warn = '';
  if (r.source === 'fixed') { rateV = `≈ ${money0(r.monthly)}/mois`; src = 'Montant fixe que tu as indiqué.'; }
  else if (r.source === 'auto') {
    rateV = `≈ ${money0(Math.max(r.monthly, 0))}/mois`;
    src = `Ce qui est resté sous ton seuil, en moyenne sur ${r.n === 1 ? 'ta dernière période terminée' : 'tes ' + r.n + ' dernières périodes terminées'}.`;
    if (r.monthly <= 0) warn = `<div class="warntext">Tes dernières périodes ont dépassé le seuil : rien n'est mis de côté à ce rythme.</div>`;
  } else { rateV = '—'; src = "L'estimation commence après ta première période terminée. En attendant, tu peux indiquer un montant fixe."; }
  const extras = [];
  if (s.wishCushion) extras.push(`Déjà de côté : ${money0(s.wishCushion)}`);
  if (wishesWaitForDebts() && hasDebt) extras.push((!s.wishAfterDebts ? 'Le reste du budget va d\'abord aux dettes. ' : '') + (debtMonths != null ? `Commence après la fin des dettes (${payoffLabel(debtMonths)})` : 'Commence après la fin des dettes, qui ne se termine pas au budget actuel'));
  head += `<div class="card rate hero">

    <span class="v num">${rateV}</span>${warn}

  </div>`;
  if (!rows.length) {
    $('#v-wishes').innerHTML = head + `<div class="empty">Ajoute ce que tu aimerais t'acheter. Expy estime quand tu pourras le payer comptant, d'après ce qui reste sous ton seuil à chaque période.</div>`;

  const li = rows.map(({ w, when, state }, i) => {
    const txt = state === 'now' ? '<b>Possible maintenant</b> avec ce qui est de côté'
      : state === 'date' ? `<b>Vers le ${esc(shortDate(when, true))}</b>${relLabel(when)}`
      : state === 'never' ? '<b>Pas atteignable</b> au rythme actuel'

    return `<li><div class="wish">

  $('#v-wishes').innerHTML = head + `<ul class="list stack">${li}</ul>
    <p class="note">Total : ${money0(total)}. Les souhaits sont financés dans l'ordre de la liste : chacun attend ceux du dessus. Les dates supposent que tu mets de côté ce qui reste sous ton seuil, sans crédit.</p>${debtHint}`;

    let sv = 0;

    const cb = $('#rvSave');

    s.reviewed[p.id] = new Date().toISOString(); persist(); closeSheet(); rerender(); if (msg) toast(msg);
  };
  $('#rvNone').addEventListener('click', () => done(''));
  $('#rvForm').addEventListener('submit', (e) => {
    e.preventDefault();

    }

    for (const [d, v] of vals) {
      if (v < d.bal) { s.payments.push({ id: uid(), debtId: d.id, amt: d.bal - v, date: todayISO(), note: 'Fin de période' }); paid += d.bal - v; }
      if (v !== d.bal) { d.bal = v; d.updated = new Date().toISOString(); }
    }
    const sim = debtSim();
    done(active.length ? `Soldes à jour${paid ? ` · ${money0(paid)} remboursés` : ''}${s.debts.some(d => d.bal > 0) ? ' · libre en ' + payoffLabel(sim.months) : ' · plus de dettes'}` : '');
  });
}

/* ---------- Toast ---------- */
function toast(msg, undo, kind = '') {
  const t = $('#toast');
  clearTimeout(UI.toastTimer);
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undoBtn">Annuler</button>' : ''}`;
  t.hidden = false;
  if (undo) $('#undoBtn').onclick = () => { undo(); t.hidden = true; clearTimeout(UI.toastTimer); };
  UI.toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 5000 : 3000);
}

/* ---------- Export / import ---------- */
function csvCell(v) { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function save(filename, data) {
  if (!S.dl) return false;
  try { await S.dl.save({ filename, data }); S.settings.lastExport = new Date().toISOString(); persist('settings'); rerender(); toast('Fichier enregistré'); return true; }
  catch (e) { if (e && e.code === 'declined') return false; toast(e && e.code === 'rate_limited' ? 'Un enregistrement est déjà en cours.' : "L'export n'a pas pu se faire ici."); return false; }
}
function exportCSV() {
  const rows = [['date', 'montant', 'categorie', 'faisable_maison', 'note', 'montant_total', 'partage_avec']];
  allItems().sort((a, b) => a.ts.localeCompare(b.ts)).forEach(i => {
    const d = new Date(i.ts);
    rows.push([d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), (i.amt / 100).toFixed(2).replace('.', ','), catById(i.cat).name, i.home ? 'oui' : 'non', i.note || '', i.split ? (i.split.total / 100).toFixed(2).replace('.', ',') : '', i.split ? personName(i.split.pid) : '']);
  });

}
function exportJSON() {
  save(`budget-sauvegarde-${todayISO()}.json`, JSON.stringify({ app: 'budget-perso-express', v: 1, exported: new Date().toISOString(), settings: S.settings, months: S.months }, null, 1));
}
$('#importIn').addEventListener('change', async (e) => {

/* ---------- Example data ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function loadDemo() {
  const r = rng(42), s = S.settings, cm = curMonth(), now = new Date();
  const pattern = [['cafe', 4.75, true, 'Allongé'], ['epicerie', 86.4, false, ''], ['restaurant', 32.5, true, 'Lunch'], ['transport', 3.75, false, 'STM'], ['cafe', 5.25, true, ''], ['maison', 24.99, false, ''], ['epicerie', 54.1, false, ''], ['restaurant', 61.0, true, 'Livraison'], ['loisirs', 28.0, false, 'Cinéma'], ['livres', 24.95, false, ''], ['jeux', 34.99, false, ''], ['autre', 18.0, false, '']];
  const touched = new Set();
  for (let m = 5; m >= 0; m--) {
    const mk = addMonths(cm, -m), d0 = parseMonth(mk);
    const lastDay = m === 0 ? now.getDate() : daysInMonth(d0);
    const n = m === 0 ? Math.max(4, Math.round(lastDay * 1.4)) : 38 + Math.floor(r() * 10);
    for (let i = 0; i < n; i++) {
      const p = pattern[Math.floor(r() * pattern.length)];
      const day = 1 + Math.floor(r() * lastDay);
      const ts = new Date(d0.getFullYear(), d0.getMonth(), day, 8 + Math.floor(r() * 12), Math.floor(r() * 60));
      if (ts > now) ts.setTime(now.getTime() - 3600e3 * (1 + i));
      const amt = Math.round(p[1] * (0.7 + r() * 0.6) * 100);
      (S.months[mk] = S.months[mk] || []).push({ id: uid(), amt, cat: p[0], ts: ts.toISOString(), home: p[2], note: p[3], ex: true });
    }
    touched.add(mKey(mk));
  }
  if (!s.periods.length) {
    // Pay-to-pay periods (the 15th to the 14th), so the example shows dates that differ from calendar months.
    let p = { id: 'p' + uid(), start: isoOf(new Date(now.getFullYear(), now.getMonth() - 6, 15)), end: isoOf(new Date(now.getFullYear(), now.getMonth() - 5, 14)), amount: 160000, ex: true };
    s.periods.push(p);
    while (p.end < todayISO()) { p = Object.assign(nextPeriod(p), { ex: true }); s.periods.push(p); }
  }
  s.debts.push({ id: uid(), name: 'Visa', bal: 480000, apr: 20.99, min: 15000, updated: new Date().toISOString(), ex: true });
  s.debts.push({ id: uid(), name: 'Marge de crédit', bal: 250000, apr: 9.5, min: 7500, updated: new Date().toISOString(), ex: true });
  if (s.debtBudget < 50000) s.debtBudget = 50000;
  s.goals.push({ id: 'g' + uid(), name: 'Voyage', target: 120000, saved: 20000, by: now.getFullYear() + '-12-31', created: isoOf(new Date(now.getFullYear(), now.getMonth() - 6, 1)), ex: true });
  if (!s.debtReserve) { s.debtReserve = true; s.debtSince = isoOf(new Date(now.getFullYear(), now.getMonth() - 6, 1)); }
  s.wishes.push({ id: 'w' + uid(), name: 'Casque audio', price: 34900, added: todayISO(), ex: true });
  s.wishes.push({ id: 'w' + uid(), name: 'Fin de semaine à Québec', price: 60000, added: todayISO(), ex: true });
  persist('settings', ...touched);
  resetEntry(); rerender();
}
function clearDemo() {
  const s = S.settings, keys = ['settings'];
  for (const [mk, arr] of Object.entries(S.months)) if (arr.some(i => i.ex)) { S.months[mk] = arr.filter(i => !i.ex); keys.push(mKey(mk)); }
  const exIds = s.debts.filter(d => d.ex).map(d => d.id);
  s.debts = s.debts.filter(d => !d.ex);
  s.payments = s.payments.filter(p => !exIds.includes(p.debtId));
  s.periods = s.periods.filter(p => !p.ex);
  s.wishes = s.wishes.filter(w => !w.ex);
  s.goals = s.goals.filter(g => !g.ex);
  if (!s.debts.length) { s.debtBudget = 0; s.debtReserve = false; s.debtGoalBy = null; s.debtSince = null; }
  persist(...keys); resetEntry(); rerender(); toast("Données d'exemple effacées");
}
