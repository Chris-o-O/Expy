<style>
@font-face { font-family: "Bricolage Grotesque"; src: url(fonts/bricolage.woff2) format("woff2"); font-weight: 200 800; font-style: normal; font-display: swap; }

[hidden] { display: none !important; }

/* Style C: white ground, black hero cards, pastel cards, vivid category colours, floating tab pill. */
:root {
  --bg: #FFFFFF;
  --surface: #F2F2F2;

  --warn: #B87200;
  --bad: #CC3229;
  --home: #C45A00;
  --key: #F2F2F2;
  --key-press: #DEDEDE;
  --shadow: none;
  --hero-bg: #0A0A0A; --hero-fg: #FFFFFF; --hero-sub: #A8A8A8; --hero-chip: rgba(255,255,255,.1); --hero-track: #2A2A2A;
  --hero-fill: #6F8BFF; --hero-link: #8FA4FF; --hero-home: #FFB36B; --hero-ok: #7DE3A6; --hero-warn: #FFC24D; --hero-bad: #FF7B70;
  --pill-bg: #0A0A0A; --pill-fg: #A8A8A8;
  --p1: #FFC7C0; --p2: #FFE3A6; --p3: #C6D8FF; --p4: #BFEBCB; --p5: #E0CCFF; --p6: #BDEBE8;
  --f-ui: "Bricolage Grotesque", "Roboto", "Segoe UI", system-ui, sans-serif;
  --f-num: "Bricolage Grotesque", "Roboto", system-ui, sans-serif;
  --f-mono: "Bricolage Grotesque", "Roboto", system-ui, sans-serif;
  --nav-h: 86px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A0A0A; --surface: #1A1A1A; --surface-2: #2C2C2C; --fg: #F3F4F6; --muted: #A8A8A8;
    --line: #2C2C2C; --accent: #6F8BFF; --accent-fg: #0A0A0A; --ok: #3DC27A; --warn: #F0A834;
    --bad: #FF6A5E; --home: #FF9A3D; --key: #1A1A1A; --key-press: #2C2C2C;
    --hero-bg: #F3F4F6; --hero-fg: #0A0A0A; --hero-sub: #5A5A5A; --hero-chip: rgba(0,0,0,.07); --hero-track: #D6D6D6;
    --hero-fill: #2B47D9; --hero-link: #2B47D9; --hero-home: #C45A00; --hero-ok: #12803E; --hero-warn: #9A5B00; --hero-bad: #C62A20;
    --pill-bg: #232323; --pill-fg: #A8A8A8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A0A0A; --surface: #1A1A1A; --surface-2: #2C2C2C; --fg: #F3F4F6; --muted: #A8A8A8;
  --line: #2C2C2C; --accent: #6F8BFF; --accent-fg: #0A0A0A; --ok: #3DC27A; --warn: #F0A834;
  --bad: #FF6A5E; --home: #FF9A3D; --key: #1A1A1A; --key-press: #2C2C2C;
  --hero-bg: #F3F4F6; --hero-fg: #0A0A0A; --hero-sub: #5A5A5A; --hero-chip: rgba(0,0,0,.07); --hero-track: #D6D6D6;
  --hero-fill: #2B47D9; --hero-link: #2B47D9; --hero-home: #C45A00; --hero-ok: #12803E; --hero-warn: #9A5B00; --hero-bad: #C62A20;
  --pill-bg: #232323; --pill-fg: #A8A8A8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(var(--nav-h) + 16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.view { display: flex; flex-direction: column; gap: 12px; }
.view[hidden] { display: none; }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-size: 26px; font-weight: 800; letter-spacing: -.03em; }
h2 { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* Hero card (black in light mode, light in dark mode) */
.hero, .summary { background: var(--hero-bg); color: var(--hero-fg); border-radius: 28px; padding: 16px 18px; }
.hero h2, .hero .note, .hero .kv .k, .hero .muted, .summary .muted { color: var(--hero-sub); }
.hero .link, .summary .link { color: var(--hero-link); }
.hero .warntext { color: var(--hero-bad); }
.hero .btn.ghost { background: var(--hero-chip); color: var(--hero-fg); }

/* Summary strip */
.summary { display: flex; flex-direction: column; gap: 8px; }
.sum-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sum-month { font-size: 13px; font-weight: 600; color: var(--hero-sub); }
.sum-total { font-size: 34px; font-weight: 800; letter-spacing: -.04em; line-height: 1.05; }
.sum-of { font-size: 14px; color: var(--hero-sub); font-weight: 600; letter-spacing: 0; }
.gauge { position: relative; height: 10px; background: var(--hero-track); border-radius: 999px; overflow: hidden; }
.gauge > i { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--hero-fill); transition: width .3s ease; }
.gauge.warn > i { background: var(--hero-warn); }
.gauge.bad > i { background: var(--hero-bad); }
.gauge > b { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--hero-fg); opacity: .55; }
.sum-line { font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sum-line .st-warn { color: var(--hero-warn); font-weight: 700; }
.sum-line .st-bad { color: var(--hero-bad); font-weight: 700; }
.sum-line .st-ok { color: var(--hero-ok); font-weight: 700; }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini { background: var(--hero-chip); color: var(--hero-fg); border-radius: 18px; padding: 7px 12px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mini .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--hero-sub); font-weight: 700; }
.mini .v { font-size: 18px; font-weight: 800; }
.mini .s { font-size: 12px; color: var(--hero-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini.home .v { color: var(--hero-home); }
.set-th { width: 100%; border: 1.5px dashed var(--line); background: transparent; border-radius: 18px; padding: 12px; font-weight: 700; color: var(--accent); }

/* Entry */
.entry { display: flex; flex-direction: column; gap: 10px; }
/* Home: dial */
.homehead { display: flex; justify-content: space-between; align-items: center; padding: 0 4px; min-height: 26px; }
#v-home { gap: 8px; }
.homehead .per { font-size: 13px; font-weight: 700; color: var(--muted); border: 0; background: transparent; padding: 0; }
.daypill { font-size: 12px; font-weight: 800; background: var(--fg); color: var(--bg); padding: 5px 11px; border-radius: 999px; }
:root { --c-debt: #8B3DFF; --c-save: #12A150; }
.dial { --ring: min(222px, 26vh); --ring: min(222px, 26dvh); position: relative; width: var(--ring); height: var(--ring); margin: 0 auto; container-type: inline-size; flex: none; max-width: 100%; transition: width .38s cubic-bezier(.3,.7,.2,1), height .38s cubic-bezier(.3,.7,.2,1); }
.dial svg { position: absolute; left: 50%; top: 0; width: var(--ring); height: var(--ring); margin-left: calc(var(--ring) / -2); display: block; transition: opacity .22s, transform .38s cubic-bezier(.3,.7,.2,1); transform-origin: 50% 100%; }
/* Keyboard open: the ring flattens into a bar, the amount grows */
.hbar { position: absolute; left: 0; right: 0; bottom: 2px; height: 14px; border-radius: 999px; background: var(--surface-2); overflow: hidden; opacity: 0; transform: scaleX(.3); transition: opacity .25s .1s, transform .38s cubic-bezier(.3,.7,.2,1); pointer-events: none; }
.hbar i { position: absolute; top: 0; bottom: 0; transition: left .3s ease, width .3s ease, background-color .2s; }
.hbar b { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1px; background: var(--accent); transition: left .3s ease; }
body.kb .dial { width: 100%; height: 132px; }
body.kb .dial svg { opacity: 0; transform: scale(.35) translateY(-20%); pointer-events: none; }
body.kb .hbar { opacity: 1; transform: none; }
body.kb .dial-c { inset: 0 0 24px 0; padding-inline: 0; }
body.kb .amount .big { font-size: 17cqw; }
body.kb .amount[data-l="l"] .big { font-size: 14cqw; }
body.kb .amount[data-l="xl"] .big { font-size: 11cqw; }
body.kb .dial-k { font-size: 3.6cqw; }
body.kb .dial-n { font-size: 4.2cqw; }
body.kb .amount .cur { font-size: 7cqw; }
.dial-c { transition: inset .38s cubic-bezier(.3,.7,.2,1), padding .38s; position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1cqw; padding-inline: 13cqw; }
.dial-k { font-size: 4.6cqw; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 1.5cqw; }
.dial-k svg { width: 5.6cqw; height: 5.6cqw; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.amount { display: flex; align-items: baseline; justify-content: center; gap: 1.5cqw; min-width: 0; max-width: 100%; }
.amount.can-kb { cursor: text; }
.amount .big { transition: font-size .38s cubic-bezier(.3,.7,.2,1); font-size: 21.7cqw; font-weight: 800; letter-spacing: -.05em; line-height: 1.1; border: 0; background: transparent; padding: 0; margin: 0; text-align: center; color: var(--fg); outline: none; caret-color: var(--accent); min-width: 1ch; max-width: 100%; width: auto; border-radius: 0; field-sizing: content; }
.amount .big::placeholder { color: var(--muted); opacity: .5; }
.amount[data-l="l"] .big { font-size: 16cqw; }
.amount[data-l="xl"] .big { font-size: 12.5cqw; }
.amount .cur { font-size: 9cqw; font-weight: 700; color: var(--muted); }
.dial-n { font-size: 5.4cqw; font-weight: 700; min-height: 1.3em; text-align: center; white-space: nowrap; }
.legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 14px; font-size: 12.5px; font-weight: 700; color: var(--muted); border: 0; background: transparent; width: 100%; padding: 0; }
.legend[hidden] { display: none; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
.legend .lk { color: var(--accent); }
.stats3 { display: flex; gap: 8px; }
.stat { flex: 1; min-width: 0; background: var(--surface-2); border-radius: 16px; padding: 7px 12px; border: 0; text-align: left; display: flex; flex-direction: column; }
.stat .k { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.stat .v { font-size: 17px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.home { background: #FFD9B8; color: #0A0A0A; }
.stat.home .k { color: #4A4A4A; }
.sheet .row .d { white-space: normal; }
.form label.chk { flex-direction: row; align-items: center; font-size: 14px; color: var(--fg); font-weight: 600; }
body:not(.appkeys) .keypad { display: none; }
body.appkeys .nat-add { display: none; }
body.kb .keypad, body.kb .tabs, body.kb #banners, body.kb .stats3, body.kb .legend, body.kb .homehead, body.kb #recentHead, body.kb #recent { display: none; }
body.kb .wrap { padding-bottom: 16px; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px 8px 11px; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
/* Category tiles with icons: two rows, scroll sideways */
.tiles { display: grid; grid-template-rows: repeat(2, 52px); grid-auto-flow: column; grid-auto-columns: calc((100% - 32px) / 5); gap: 8px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; margin-inline: -16px; padding-inline: 16px; scroll-padding-inline: 16px; }
.tiles::-webkit-scrollbar { display: none; }
.tile { scroll-snap-align: start; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 18px; background: var(--surface); padding: 0; min-width: 0; }
.tile .ico { width: 34px; height: 34px; }
.tile .ico svg { width: 20px; height: 20px; }
.tile[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.ico { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; flex: none; }
.ico svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.opts-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.toggle .sw { width: 30px; height: 18px; border-radius: 9px; background: var(--surface-2); position: relative; transition: background .15s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle[aria-pressed="true"] { border-color: var(--home); color: var(--home); }
.toggle[aria-pressed="true"] .sw { background: var(--home); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(12px); background: #fff; }
.link { border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 13.5px; padding: 6px 4px; }
.opts { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.field { width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 14px; padding: 9px 12px; font-size: 15px; }
.field:focus { border-color: var(--accent); outline: none; }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: clamp(40px, 5.6vh, 46px); grid-auto-rows: clamp(40px, 5.6dvh, 46px); gap: 8px; }
.keypad button { border: 0; border-radius: 16px; background: var(--key); box-shadow: var(--shadow); font-family: var(--f-num); font-size: 24px; font-weight: 700; user-select: none; }
.keypad button:active { background: var(--key-press); }
.keypad .zero { grid-column: 1 / span 3; }
.keypad .fn { background: var(--surface-2); box-shadow: none; font-size: 21px; }
.keypad .add { grid-column: 4; grid-row: 3 / span 2; background: var(--accent); color: var(--accent-fg); font-family: var(--f-ui); font-size: 17px; font-weight: 800; border-radius: 22px; }
.keypad .add:disabled { opacity: .35; cursor: default; }
.keypad .add:active:not(:disabled) { filter: brightness(.92); background: var(--accent); }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 16px; border-top: 1px solid var(--line); width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.list > li:first-child .row { border-top: 0; }
.row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .t { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .d { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 800; }
.tag { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 3px 8px; border-radius: 999px; }
.tag.home { color: var(--home); border: 1px solid var(--home); }
.tag.ex { color: var(--muted); border: 1px dashed var(--muted); }
.tag.prio { background: var(--fg); color: var(--bg); }
.empty { padding: 18px 16px; color: var(--muted); font-size: 14px; text-align: center; background: var(--surface); border-radius: 24px; }
.empty .link { display: inline; }
/* Pastel card stacks (debts, wishes) */
.stack { background: transparent; border-radius: 0; overflow: visible; display: flex; flex-direction: column; gap: 10px; }
.stack > li { border-radius: 24px; overflow: hidden; color: #0A0A0A; --fg: #0A0A0A; --muted: #4A4A4A; --ok: #0E6B38; --bad: #B3261E; --line: rgba(10,10,10,.14); --bg: #fff; }
.stack > li:nth-child(6n+1) { background: var(--p1); }
.stack > li:nth-child(6n+2) { background: var(--p2); }
.stack > li:nth-child(6n+3) { background: var(--p3); }
.stack > li:nth-child(6n+4) { background: var(--p4); }
.stack > li:nth-child(6n+5) { background: var(--p5); }
.stack > li:nth-child(6n+6) { background: var(--p6); }
.stack .tag.prio { background: #0A0A0A; color: #fff; }
.stack .tag.ex { border-color: #4A4A4A; }
.meter { height: 8px; border-radius: 999px; background: rgba(10,10,10,.14); overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; border-radius: 999px; background: #0A0A0A; }

/* Banners */
.banner { border-radius: 20px; padding: 12px 14px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1.5px solid var(--line); background: var(--surface); }
.banner.ex { border-style: dashed; }
.banner.warn { border-color: var(--warn); }
.banner.bad { border-color: var(--bad); }

/* Cards & views */
.card { background: var(--surface); border-radius: 24px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.card.hero { background: var(--hero-bg); border-radius: 28px; padding: 18px 20px; }
.card.peach { background: #FFD9B8; color: #0A0A0A; --muted: #4A4A4A; --home: #8A3F00; }
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; }
.btn { border: 0; border-radius: 999px; padding: 11px 18px; font-weight: 800; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
.btn.block { width: 100%; padding: 14px; }
.btn:disabled { opacity: .4; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv > div { min-width: 0; display: flex; flex-direction: column; }
.kv .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
.kv .v { font-size: 18px; font-weight: 800; overflow-wrap: anywhere; }
.free { display: flex; flex-direction: column; gap: 2px; }
.free .v { font-size: 46px; font-weight: 800; letter-spacing: -.04em; line-height: 1.05; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 9px; font-weight: 700; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.range { width: 100%; accent-color: var(--accent); }
.debt { display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; width: 100%; text-align: left; background: transparent; border: 0; }
.debt .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.debt .name { font-weight: 800; font-size: 18px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.debt .bal { font-size: 24px; font-weight: 800; letter-spacing: -.03em; }
.debt .l2 { font-size: 12.5px; font-weight: 600; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }

/* ---------- Debt payoff simulation (pure) ---------- */
// debts: [{id, bal (cents), apr (%), min (cents)}], budget in cents, method 'avalanche' | 'snowball'.
// Each month: interest accrues, minimums are paid, the rest of the budget goes to the priority debt.
// A debt's month index k means it is paid off k months after the current month.
function simulate(debts, budgetC, method) {
  const ds = debts.filter(d => d.bal > 0).map(d => ({ id: d.id, bal: d.bal / 100, r: (d.apr || 0) / 1200, apr: d.apr || 0, min: (d.min || 0) / 100, payoff: null, interest: 0 }));
  const sumMin = Math.round(ds.reduce((s, d) => s + d.min, 0) * 100);
  const res = { months: 0, payoff: {}, interest: 0, sumMin, priority: null, never: false, short: budgetC < sumMin };
  if (!ds.length) return res;
  const order = () => ds.filter(d => d.bal > 0.004).sort(method === 'snowball'
    ? (a, b) => (a.bal - b.bal) || (b.apr - a.apr)
    : (a, b) => (b.apr - a.apr) || (a.bal - b.bal));
  res.priority = order()[0].id;
  const budget = Math.max(budgetC, 0) / 100;
  let m = 0, total = 0;
  while (ds.some(d => d.bal > 0.004) && m < 600) {
    m++;
    for (const d of ds) if (d.bal > 0.004) { const i = d.bal * d.r; d.bal += i; d.interest += i; total += i; }

    for (const d of ds) if (d.bal > 0.004) { const p = Math.min(d.min, d.bal, avail); d.bal -= p; avail -= p; }

  res.interest = Math.round(total * 100);
  res.never = ds.some(d => d.payoff == null);
  res.months = res.never ? null : m;
  return res;
}
// Single debt, closed form: n = -ln(1 - rB/P) / ln(1 + r)
function monthsClosedForm(balC, apr, payC) {

}
function renderRing() {
  const h = UI.hs; if (!h) return;
  const e = amtCents(), C = RING_C;
  const arc = (a, l, color, cap) => l > 0.0004 ? `<circle cx="120" cy="120" r="100" fill="none" stroke-width="20" stroke-linecap="${cap || 'butt'}" style="stroke:${color}" stroke-dasharray="${(l * C).toFixed(1)} ${(C - l * C + 2).toFixed(1)}" stroke-dashoffset="${(-a * C).toFixed(1)}" transform="rotate(-90 120 120)"/>` : '';
  let svg = `<circle cx="120" cy="120" r="100" fill="none" stroke-width="20" style="stroke:var(--surface-2)"/>`, note, label;
  if (h.per) {
    const A = h.amount, rs = h.rs;
    const fs = Math.min(rs.save / A, 1), fd = Math.min(rs.debt / A, 1 - fs);
    svg += arc(1 - fs, fs, 'var(--c-save)') + arc(1 - fs - fd, fd, 'var(--c-debt)');
    const sp = Math.min(h.spent / A, 1);
    const hot = h.left < 0 ? 'var(--bad)' : (h.free > 0 && h.spent >= .8 * h.free) ? 'var(--warn)' : 'var(--fg)';
    svg += arc(0, sp, hot, 'round');
    if (e > 0) svg += arc(sp, Math.min(e / A, 1 - sp), catById(UI.cat).color, 'round');
    if (h.free > 0) {
      const ang = ((h.free * (h.elapsed - 0.5) / h.len) / A) * 2 * Math.PI - Math.PI / 2, cx = Math.cos(ang), cy = Math.sin(ang);
      svg += `<line x1="${(120 + 87 * cx).toFixed(1)}" y1="${(120 + 87 * cy).toFixed(1)}" x2="${(120 + 113 * cx).toFixed(1)}" y2="${(120 + 113 * cy).toFixed(1)}" stroke-width="4" stroke-linecap="round" style="stroke:var(--accent)"/>`;
    }
    if (e > 0) {
      const after = h.left - e;
      note = after >= 0 ? `<span style="color:${h.free > 0 && h.spent + e >= .8 * h.free ? 'var(--warn)' : 'var(--ok)'}">→ reste ${money(after)}</span>` : `<span style="color:var(--bad)">→ dépasse de ${money(-after)}</span>`;
    } else note = `<span class="muted">sur ${money0(h.free)} libres</span>`;
    label = `${Math.round(h.spent / A * 100)} % du seuil dépensé${rs.total ? ', ' + Math.round(rs.total / A * 100) + ' % réservé' : ''}`;
  } else {
    note = `<span class="muted">${esc(h.label)} : ${money0(h.spent)}</span>`; label = 'Aucune période définie';
  }
  $('#ring').innerHTML = svg; $('#ring').setAttribute('aria-label', label);
  const seg = (id, a, l, c) => { const el = $('#' + id); el.style.left = (a * 100).toFixed(2) + '%'; el.style.width = (Math.max(0, l) * 100).toFixed(2) + '%'; if (c) el.style.background = c; };
  if (h.per) {
    const A = h.amount, rs = h.rs, fs = Math.min(rs.save / A, 1), fd = Math.min(rs.debt / A, 1 - fs), sp = Math.min(h.spent / A, 1);
    seg('hb-sp', 0, sp, h.left < 0 ? 'var(--bad)' : (h.free > 0 && h.spent >= .8 * h.free) ? 'var(--warn)' : 'var(--fg)');
    seg('hb-gh', sp, e > 0 ? Math.min(e / A, 1 - sp) : 0, catById(UI.cat).color);
    seg('hb-de', 1 - fs - fd, fd, 'var(--c-debt)'); seg('hb-sa', 1 - fs, fs, 'var(--c-save)');
    $('#hb-pc').style.left = (h.free > 0 ? Math.min(100, (h.free * (h.elapsed - 0.5) / h.len) / A * 100) : -5) + '%';
  } else for (const id of ['hb-sp', 'hb-gh', 'hb-de', 'hb-sa']) seg(id, 0, 0);
  $('#dialN').innerHTML = note;
}
// The latest finished period whose debts have not been updated yet (shown the day after it ends).
function pendingReview() {
  const s = S.settings, today = todayISO();
  if (!s.debts.some(d => d.bal > 0) && !s.goals.some(g => g.target - g.saved > 0)) return null;
  const p = s.periods.filter(x => x.end < today && !x.ex).sort((a, b) => b.end.localeCompare(a.end))[0];
  if (!p || s.reviewed[p.id] || UI.reviewLater === p.id) return null;
  return p;
}

function periodStatus(p) {
  const t = sumC(itemsIn(p)), today = todayISO();
  const cur = p.start <= today && today <= p.end, future = p.start > today;
  let st;
  if (future) st = '<span class="muted">À venir</span>';
  else if (t > p.amount) st = `<span style="color:var(--bad);font-weight:600">Dépassé de ${money0(t - p.amount)}</span>`;
  else st = `<span style="color:var(--ok);font-weight:600">${cur ? 'Reste' : 'Sous le seuil de'} ${money0(p.amount - t)}</span>`;
  return { t, st, cur, future };
}
function periodsCard() {
  const today = todayISO();
  const ps = S.settings.periods.filter(p => p.start <= today).sort((a, b) => b.start.localeCompare(a.start)).slice(0, 8);
  if (!ps.length) return `<div class="card"><h2>Périodes de budget</h2><div class="note">Aucune période définie.</div><button class="btn ghost" data-act="period-new">Définir une période</button></div>`;
  return `<div class="card"><h2>Périodes de budget</h2><ul class="list" style="box-shadow:none;background:transparent">${ps.map(p => {
    const { t, st, cur } = periodStatus(p);
    return `<li><button class="row" data-act="period-edit" data-id="${esc(p.id)}" style="padding-inline:0">
      <span class="main"><span class="t">${esc(rangeLabel(p, true))}${cur ? ' <span class="tag prio">En cours</span>' : ''}${p.ex ? ' <span class="tag ex">ex.</span>' : ''}</span><span class="d">${money0(t)} sur ${money0(p.amount)} · ${st}</span></span></button></li>`;
  }).join('')}</ul></div>`;
}

/* ---------- Wish list ---------- */
// Saving capacity = what stayed under the threshold in the last finished periods (up to 6), per day.
// A fixed monthly amount set by the user overrides it.
function autoLeftover() {
  const today = todayISO();
  const done = S.settings.periods.filter(p => p.end < today).sort((a, b) => b.end.localeCompare(a.end)).slice(0, 6);
  if (!done.length) return null;
  let left = 0, days = 0;
  for (const p of done) { left += p.amount - reserveFor(p).total - sumC(itemsIn(p)); days += periodLen(p); }
  const perDay = left / days;
  return { perDay, monthly: Math.round(perDay * 30.4375), n: done.length };
}
function savingRate() {
  const s = S.settings;
  if (s.wishRate != null) return { perDay: s.wishRate / 30.4375, monthly: s.wishRate, source: 'fixed' };
  const a = autoLeftover();
  if (!a) return { perDay: null, monthly: null, source: 'none' };
  return Object.assign({ source: 'auto' }, a);
}

// End-of-period check-in: recap of the period, then the balance of each debt today.
// A lower balance is logged as a payment; a higher one just updates the balance (new charges).

  const s = S.settings, p = s.periods.find(x => x.id === pid);
  if (!p) return;
  const rs = reserveFor(p), spent = sumC(itemsIn(p)), left = p.amount - rs.total - spent;
  const payC = Math.max(0, left) + rs.debt;

  const pd = active.find(d => d.id === prio) || active[0];
  openSheet(`<h1>Fin de période</h1>
    <div class="card"><div class="kv">

      <div><span class="k">Seuil</span><span class="v num">${money0(p.amount)}</span></div>

      ${payC > 0 && pd ? `<button type="button" class="btn ghost" id="rvApply">Déduire ${money0(payC)} de ${esc(pd.name)}${rs.debt ? ' (reste + réserve)' : ''}</button>` : ''}
      ${rs.save > 0 ? `<label class="chk" style="font-size:14px;color:var(--fg)"><input type="checkbox" id="rvSave" checked>Verser ${money0(rs.save)} à mes objectifs d'épargne</label>` : ''}
      <div class="warntext" id="rvErr" hidden></div>
      <button class="btn block" type="submit">Enregistrer les soldes</button>
      <button class="btn ghost block" type="button" id="rvNone">Rien à changer</button>
    </form>`);
  if (payC > 0 && pd) $('#rvApply').addEventListener('click', () => {
    const f = $('#rv-' + pd.id); f.value = toInputMoney(Math.max(0, pd.bal - payC));
  });
  const done = (msg) => {
    let sv = 0;
    const cb = $('#rvSave');
    if (cb && cb.checked) for (const g of rs.goals) { const o = s.goals.find(x => x.id === g.id); if (o) { o.saved = Math.min(o.target, o.saved + g.amt); sv += g.amt; } }
    if (sv) msg = (msg ? msg + ' · ' : '') + `${money0(sv)} versés à l'épargne`;
    s.reviewed[p.id] = new Date().toISOString(); persist(); closeSheet(); rerender(); if (msg) toast(msg);
  };
  $('#rvNone').addEventListener('click', () => done(''));
  $('#rvForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const vals = [];
    for (const d of active) {
      const v = parseMoney($('#rv-' + d.id).value);
      if (v == null || isNaN(v)) { $('#rvErr').textContent = `Indique le solde de ${d.name} (0 si payée au complet).`; $('#rvErr').hidden = false; return; }
      vals.push([d, v]);

    for (const [d, v] of vals) {
      if (v < d.bal) { s.payments.push({ id: uid(), debtId: d.id, amt: d.bal - v, date: todayISO(), note: 'Fin de période' }); paid += d.bal - v; }
      if (v !== d.bal) { d.bal = v; d.updated = new Date().toISOString(); }

    done(active.length ? `Soldes à jour${paid ? ` · ${money0(paid)} remboursés` : ''}${s.debts.some(d => d.bal > 0) ? ' · libre en ' + payoffLabel(sim.months) : ' · plus de dettes'}` : '');
  });
}

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function loadDemo() {
  const r = rng(42), s = S.settings, cm = curMonth(), now = new Date();
  const pattern = [['cafe', 4.75, true, 'Allongé'], ['epicerie', 86.4, false, ''], ['restaurant', 32.5, true, 'Lunch'], ['transport', 3.75, false, 'STM'], ['cafe', 5.25, true, ''], ['maison', 24.99, false, ''], ['epicerie', 54.1, false, ''], ['restaurant', 61.0, true, 'Livraison'], ['loisirs', 28.0, false, 'Cinéma'], ['livres', 24.95, false, ''], ['jeux', 34.99, false, ''], ['autre', 18.0, false, '']];
  const touched = new Set();
  for (let m = 5; m >= 0; m--) {
    const mk = addMonths(cm, -m), d0 = parseMonth(mk);
    const lastDay = m === 0 ? now.getDate() : daysInMonth(d0);
    const n = m === 0 ? Math.max(4, Math.round(lastDay * 1.4)) : 38 + Math.floor(r() * 10);
    for (let i = 0; i < n; i++) {
      const p = pattern[Math.floor(r() * pattern.length)];
      const day = 1 + Math.floor(r() * lastDay);
      const ts = new Date(d0.getFullYear(), d0.getMonth(), day, 8 + Math.floor(r() * 12), Math.floor(r() * 60));
      if (ts > now) ts.setTime(now.getTime() - 3600e3 * (1 + i));
      const amt = Math.round(p[1] * (0.7 + r() * 0.6) * 100);
      (S.months[mk] = S.months[mk] || []).push({ id: uid(), amt, cat: p[0], ts: ts.toISOString(), home: p[2], note: p[3], ex: true });
    }
    touched.add(mKey(mk));
  }
  if (!s.periods.length) {
    // Pay-to-pay periods (the 15th to the 14th), so the example shows dates that differ from calendar months.
    let p = { id: 'p' + uid(), start: isoOf(new Date(now.getFullYear(), now.getMonth() - 6, 15)), end: isoOf(new Date(now.getFullYear(), now.getMonth() - 5, 14)), amount: 160000, ex: true };
    s.periods.push(p);
    while (p.end < todayISO()) { p = Object.assign(nextPeriod(p), { ex: true }); s.periods.push(p); }
  }
  s.debts.push({ id: uid(), name: 'Visa', bal: 480000, apr: 20.99, min: 15000, updated: new Date().toISOString(), ex: true });
  s.debts.push({ id: uid(), name: 'Marge de crédit', bal: 250000, apr: 9.5, min: 7500, updated: new Date().toISOString(), ex: true });
  if (s.debtBudget < 50000) s.debtBudget = 50000;
  s.goals.push({ id: 'g' + uid(), name: 'Voyage', target: 120000, saved: 20000, by: now.getFullYear() + '-12-31', created: isoOf(new Date(now.getFullYear(), now.getMonth() - 6, 1)), ex: true });
  if (!s.debtReserve) { s.debtReserve = true; s.debtSince = isoOf(new Date(now.getFullYear(), now.getMonth() - 6, 1)); }
  s.wishes.push({ id: 'w' + uid(), name: 'Casque audio', price: 34900, added: todayISO(), ex: true });
  s.wishes.push({ id: 'w' + uid(), name: 'Fin de semaine à Québec', price: 60000, added: todayISO(), ex: true });
  persist('settings', ...touched);
  resetEntry(); rerender();
}
function clearDemo() {
  const s = S.settings, keys = ['settings'];
  for (const [mk, arr] of Object.entries(S.months)) if (arr.some(i => i.ex)) { S.months[mk] = arr.filter(i => !i.ex); keys.push(mKey(mk)); }
  const exIds = s.debts.filter(d => d.ex).map(d => d.id);
  s.debts = s.debts.filter(d => !d.ex);
  s.payments = s.payments.filter(p => !exIds.includes(p.debtId));
  s.periods = s.periods.filter(p => !p.ex);
  s.wishes = s.wishes.filter(w => !w.ex);
  s.goals = s.goals.filter(g => !g.ex);
  if (!s.debts.length) { s.debtBudget = 0; s.debtReserve = false; s.debtGoalBy = null; s.debtSince = null; }
  persist(...keys); resetEntry(); rerender(); toast("Données d'exemple effacées");
}

/* ---------- Navigation & events ---------- */
function showTab(tab) {
  if (nativeOn()) endNative(false);
  UI.tab = tab;
  for (const v of ['home', 'debts', 'wishes', 'stats', 'settings']) $('#v-' + v).hidden = tab !== v;
  document.querySelectorAll('.tabs [data-tab]').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  rerender();
  window.scrollTo(0, 0);
}
function rerender() {
  if (rollPeriods()) persist('settings');
  if (UI.tab === 'home') renderHome();
  else if (UI.tab === 'debts') renderDebts();
  else if (UI.tab === 'stats') renderStats();
  else if (UI.tab === 'wishes') renderWishes();
  else renderSettings();
}
document.addEventListener('click', (e) => {
  const k = e.target.closest('[data-k]');
  if (k) { key(k.dataset.k); return; }
  const t = e.target.closest('[data-act]');
  if (e.target === $('#sheet')) { closeSheet(); return; }
  if (!t) return;
  const a = t.dataset.act;
  switch (a) {
    case 'add': addExpense(); break;
    case 'pick-cat': UI.cat = t.dataset.cat; UI.catPicked = true; if (!UI.homePicked) UI.home = !!catById(UI.cat).home; renderChips(); renderHomeToggle(); break;
    case 'toggle-home': UI.home = !UI.home; UI.homePicked = true; renderHomeToggle(); break;
    case 'toggle-opts': UI.optsOpen = !UI.optsOpen; $('#opts').hidden = !UI.optsOpen; t.setAttribute('aria-expanded', String(UI.optsOpen)); break;
    case 'tab': showTab(t.dataset.tab); break;
    case 'edit-th': { const ap = activePeriod(); sheetPeriod(ap ? ap.id : null); break; }
    case 'period-new': sheetPeriod(null); break;
    case 'wish-new': sheetWish(null); break;
    case 'review': sheetReview(t.dataset.id); break;
    case 'apply-update': t.disabled = true; t.textContent = 'Mise à jour…'; applyUpdate(); break;
    case 'review-later': { const rv = pendingReview(); if (rv) UI.reviewLater = rv.id; renderBanners(); break; }
    case 'wish-edit': sheetWish(t.dataset.id); break;
    case 'wish-settings': sheetWishSettings(); break;
    case 'wish-move': {
      const ws = S.settings.wishes, i = ws.findIndex(x => x.id === t.dataset.id), j = i + Number(t.dataset.d);
      if (i < 0 || j < 0 || j >= ws.length) break;
      [ws[i], ws[j]] = [ws[j], ws[i]]; persist(); renderWishes(); break;
    }
    case 'period-edit': sheetPeriod(t.dataset.id); break;
    case 'edit-item': sheetItem(t.dataset.id); break;
    case 'debt-new': sheetDebt(null); break;
    case 'debt-edit': sheetDebt(t.dataset.id); break;
    case 'method': S.settings.method = t.dataset.m; persist('settings'); renderDebts(); break;
    case 'month': UI.statsMonth = addMonths(UI.statsMonth, Number(t.dataset.d)); renderStats(); break;
    case 'native-kb': startNative(); break;
    case 'goals': sheetGoals(); break;
    case 'goal-new': sheetGoal(null); break;
    case 'goal-edit': sheetGoal(t.dataset.id); break;
    case 'kb-pref': S.settings.kb = t.dataset.v; UI.kbFail = false; persist('settings'); renderSettings(); break;
    case 'cat-icon': sheetCatIcon(t.dataset.id); break;
    case 'pick-icon': { const c = S.settings.cats.find(x => x.id === t.dataset.id); if (c) { c.icon = t.dataset.key; persist('settings'); sheetCatIcon(c.id); renderSettings(); } break; }
    case 'pick-color': { const c = S.settings.cats.find(x => x.id === t.dataset.id); if (c) { c.color = t.dataset.color; persist('settings'); sheetCatIcon(c.id); renderSettings(); } break; }
    case 'theme': S.settings.theme = t.dataset.t; persist('settings'); applyTheme(); renderSettings(); break;
    case 'cat-add': {
      const name = $('#newCat').value.trim(); if (!name) { $('#newCat').focus(); return; }
      const used = new Set(S.settings.cats.map(c => c.color));
      S.settings.cats.push({ id: 'c' + uid(), name, color: PALETTE.find(p => !used.has(p)) || PALETTE[S.settings.cats.length % PALETTE.length], limit: null, home: false });
      persist('settings'); renderSettings(); break;
    }
    case 'cat-del': {
      if (UI.confirm !== 'cat:' + t.dataset.id) { UI.confirm = 'cat:' + t.dataset.id; t.textContent = 'OK ?'; t.style.fontSize = '12px'; t.style.color = 'var(--bad)'; return; }
      S.settings.cats = S.settings.cats.filter(c => c.id !== t.dataset.id); UI.confirm = null;
      persist('settings'); renderSettings(); break;
    }
    case 'export-csv': exportCSV(); break;
    case 'export-json': exportJSON(); break;
    case 'import': $('#importIn').click(); break;
    case 'load-demo': loadDemo(); break;
    case 'clear-demo': clearDemo(); break;
    case 'close-sheet': closeSheet(); break;
    case 'install': if (UI.installEvt) { const ev = UI.installEvt; ev.prompt(); ev.userChoice.finally(() => { UI.installEvt = null; rerender(); }); } break;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'amtIn') { onNativeInput(e.target); return; }
  if (e.target.id === 'budgetIn') { const v = parseMoney(e.target.value); if (v != null && !isNaN(v)) previewBudget(v); }
});
document.addEventListener('change', (e) => {
  const el = e.target, f = el.dataset && el.dataset.field, s = S.settings;
  if (el.id === 'budgetIn') { const v = parseMoney(el.value); if (v != null && !isNaN(v)) { s.debtBudget = v; persist('settings'); } renderDebts(); return; }
  if (el.id === 'leftoverToggle') { s.leftoverToDebt = el.checked; persist('settings'); renderDebts(); return; }
  if (el.id === 'gDebtOn') { s.debtReserve = el.checked; if (el.checked) s.debtSince = todayISO(); persist('settings'); sheetGoals(); rerender(); return; }
  if (el.id === 'gDebtBy') { s.debtGoalBy = el.value && el.value > todayISO() ? el.value : null; persist('settings'); sheetGoals(); rerender(); return; }
  if (!f) return;
  {
    const c = s.cats.find(x => x.id === el.dataset.id); if (!c) return;
    if (f === 'cat-name') { const n = el.value.trim(); if (n) c.name = n; else el.value = c.name; }
    if (f === 'cat-limit') { const v = parseMoney(el.value); c.limit = (v == null || isNaN(v) || v <= 0) ? null : v; }
    if (f === 'cat-home') c.home = el.checked;
    persist('settings');
  }
});
document.addEventListener('keydown', (e) => {
  if (UI.tab !== 'home' || !$('#sheet').hidden) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if ((tag === 'input' && !(e.target.id === 'amtIn' && e.target.readOnly)) || tag === 'textarea' || tag === 'select') return;
  if (/^[0-9]$/.test(e.key)) { key(e.key); e.preventDefault(); }
  else if (e.key === ',' || e.key === '.') { key(','); e.preventDefault(); }
  else if (e.key === 'Backspace') { key('back'); e.preventDefault(); }
  else if (e.key === 'Enter' && amtCents() > 0) { addExpense(); e.preventDefault(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'amtIn' && !e.target.readOnly) { e.preventDefault(); if (amtCents() > 0) addExpense(); else endNative(false); } });
// Keep focus in the amount field while tapping tiles / toggle / Add, so the device keyboard stays up.
document.addEventListener('mousedown', (e) => { if (nativeOn() && e.target.closest('.tile, #homeToggle, #addBtn2')) e.preventDefault(); });
document.addEventListener('focusout', (e) => { if (e.target.id === 'amtIn') setTimeout(() => { const i = $('#amtIn'); if (!i.readOnly && document.activeElement !== i) endNative(false); }, 120); });
// Keyboard dismissed (e.g. Android back) without a blur: return to the in-app keypad.
if (window.visualViewport) window.visualViewport.addEventListener('resize', () => { if (nativeOn() && UI.kbOK && viewH() > UI.kbH0 - 60) endNative(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.id === 'budgetIn') e.target.blur(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) rerender(); });

/* ---------- Boot ---------- */
applyCache(loadCache());
applyTheme();
resetEntry();
const HASH_TABS = { '#dettes': 'debts', '#souhaits': 'wishes', '#stats': 'stats', '#reglages': 'settings' };
showTab(HASH_TABS[location.hash] || 'home');
window.addEventListener('hashchange', () => { if (HASH_TABS[location.hash]) showTab(HASH_TABS[location.hash]); });
connect().then(() => { resetEntry(); rerender(); });

window.__budget = { reserveFor, startNative, endNative, homeState, simulate, monthsClosedForm, S, UI, normalize, rollPeriods, nextPeriod, activePeriod, trackingStart, savingRate, wishPlan, persist, rerender, debtSim, autoLeftover, pendingReview };
})();
</script>
