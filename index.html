<!doctype html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Expy</title>
<meta name="description" content="Saisie de dépenses en 2 secondes, seuil par période et suivi de dettes.">
<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Archivo"; src: url(fonts/archivo.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; font-style: normal; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(fonts/plex-mono-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "IBM Plex Mono"; src: url(fonts/plex-mono-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; overscroll-behavior-y: none; }
[hidden] { display: none !important; }
/* Layout: one-thumb phone app. Summary strip on top, amount + categories in the middle,
   keypad in the thumb zone, tab bar fixed at the bottom. */
:root {
  --bg: #F2F3F6;
  --surface: #FFFFFF;
  --surface-2: #E7E9F0;
  --fg: #13151B;
  --muted: #5A6072;
  --line: #D7DAE3;
  --accent: #2B47D9;
  --accent-fg: #FFFFFF;
  --ok: #1B8A4B;
  --warn: #B87200;
  --bad: #CC3229;
  --home: #A9561F;
  --key: #FFFFFF;
  --key-press: #DCE0EA;
  --shadow: 0 1px 2px rgba(19,21,27,.06), 0 2px 8px rgba(19,21,27,.05);
  --f-ui: "Archivo", "Roboto", "Segoe UI", system-ui, sans-serif;
  --f-num: "Archivo", "Roboto", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Roboto Mono", monospace;
  --nav-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F13; --surface: #171A21; --surface-2: #232733; --fg: #ECEEF4; --muted: #99A0B2;
    --line: #2B3040; --accent: #8396FF; --accent-fg: #0D0F13; --ok: #3DC27A; --warn: #F0A834;
    --bad: #FF6A5E; --home: #E58C52; --key: #1D2029; --key-press: #2C313F;
    --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F13; --surface: #171A21; --surface-2: #232733; --fg: #ECEEF4; --muted: #99A0B2;
  --line: #2B3040; --accent: #8396FF; --accent-fg: #0D0F13; --ok: #3DC27A; --warn: #F0A834;
  --bad: #FF6A5E; --home: #E58C52; --key: #1D2029; --key-press: #2C313F;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--fg); font-family: var(--f-ui); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; font-stretch: 110%; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.wrap { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; }
.view { display: flex; flex-direction: column; gap: 12px; }
.view[hidden] { display: none; }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 750; font-stretch: 112%; letter-spacing: -.01em; }
h2 { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }

/* Summary strip */
.summary { background: var(--surface); border-radius: 16px; padding: 14px 14px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.sum-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.sum-month { font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sum-total { font-size: 28px; font-weight: 760; font-stretch: 115%; letter-spacing: -.02em; line-height: 1.05; }
.sum-of { font-size: 14px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.gauge { position: relative; height: 10px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.gauge > i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: var(--ok); transition: width .3s ease; }
.gauge.warn > i { background: var(--warn); }
.gauge.bad > i { background: var(--bad); }
.gauge > b { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--fg); opacity: .45; }
.sum-line { font-size: 13.5px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sum-line .st-warn { color: var(--warn); font-weight: 600; }
.sum-line .st-bad { color: var(--bad); font-weight: 600; }
.sum-line .st-ok { color: var(--ok); font-weight: 600; }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mini { background: var(--surface-2); border-radius: 12px; padding: 8px 10px; border: 0; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.mini .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.mini .v { font-size: 17px; font-weight: 720; font-stretch: 110%; }
.mini .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini.home .v { color: var(--home); }
.set-th { width: 100%; border: 1.5px dashed var(--line); background: transparent; border-radius: 12px; padding: 10px; font-weight: 600; color: var(--accent); }

/* Entry */
.entry { display: flex; flex-direction: column; gap: 10px; }
.amount { display: flex; align-items: baseline; justify-content: center; gap: 6px; padding-block: 4px 0; min-height: 60px; }
.amount .big { font-size: 46px; font-weight: 780; font-stretch: 118%; letter-spacing: -.03em; line-height: 1.1; }
.amount .big.is-empty { color: var(--muted); opacity: .5; }
.amount .cur { font-size: 24px; font-weight: 600; color: var(--muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 2px; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 7px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px 8px 11px; font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.chip[aria-pressed="true"] { border-color: var(--fg); background: var(--fg); color: var(--bg); }
.opts-row { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.toggle { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--line); background: transparent; border-radius: 999px; padding: 6px 12px 6px 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
.toggle .sw { width: 30px; height: 18px; border-radius: 9px; background: var(--surface-2); position: relative; transition: background .15s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
.toggle[aria-pressed="true"] { border-color: var(--home); color: var(--home); }
.toggle[aria-pressed="true"] .sw { background: var(--home); }
.toggle[aria-pressed="true"] .sw::after { transform: translateX(12px); background: var(--surface); }
.link { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 13.5px; padding: 6px 4px; }
.opts { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.field { width: 100%; min-width: 0; border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 11px; font-size: 15px; }
.field:focus { border-color: var(--accent); outline: none; }
.keypad { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 52px; gap: 7px; }
.keypad button { border: 0; border-radius: 12px; background: var(--key); box-shadow: var(--shadow); font-family: var(--f-num); font-size: 24px; font-weight: 600; font-stretch: 110%; user-select: none; }
.keypad button:active { background: var(--key-press); }
.keypad .zero { grid-column: 1 / span 3; }
.keypad .fn { background: var(--surface-2); box-shadow: none; font-size: 21px; }
.keypad .add { grid-column: 4; grid-row: 3 / span 2; background: var(--accent); color: var(--accent-fg); font-family: var(--f-ui); font-size: 16px; font-weight: 700; font-stretch: 100%; }
.keypad .add:disabled { opacity: .35; cursor: default; }
.keypad .add:active:not(:disabled) { filter: brightness(.92); background: var(--accent); }

/* Lists */
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.row { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-top: 1px solid var(--line); width: 100%; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
.list > li:first-child .row { border-top: 0; }
.row .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.row .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.row .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .d { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .amt { font-weight: 650; }
.tag { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 2px 6px; border-radius: 5px; }
.tag.home { color: var(--home); border: 1px solid var(--home); }
.tag.ex { color: var(--muted); border: 1px dashed var(--muted); }
.tag.prio { background: var(--accent); color: var(--accent-fg); }
.empty { padding: 18px 16px; color: var(--muted); font-size: 14px; text-align: center; background: var(--surface); border-radius: 14px; }
.empty .link { display: inline; }

/* Banners */
.banner { border-radius: 12px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; border: 1.5px solid var(--line); background: var(--surface); }
.banner.ex { border-style: dashed; }
.banner.warn { border-color: var(--warn); }
.banner.bad { border-color: var(--bad); }

/* Cards & views */
.card { background: var(--surface); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; }
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 4px; }
.btn { border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 650; background: var(--accent); color: var(--accent-fg); }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
.btn.block { width: 100%; padding: 13px; }
.btn:disabled { opacity: .4; }
.kv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.kv > div { min-width: 0; display: flex; flex-direction: column; }
.kv .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kv .v { font-size: 17px; font-weight: 720; font-stretch: 110%; overflow-wrap: anywhere; }
.free { display: flex; flex-direction: column; gap: 2px; }
.free .v { font-size: 30px; font-weight: 780; font-stretch: 116%; letter-spacing: -.02em; line-height: 1.1; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.range { width: 100%; accent-color: var(--accent); }
.debt { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left; background: transparent; border-left: 0; border-right: 0; border-bottom: 0; }
.list > li:first-child .debt { border-top: 0; }
.debt .l1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.debt .name { font-weight: 700; display: flex; gap: 8px; align-items: center; min-width: 0; }
.debt .bal { font-size: 18px; font-weight: 740; }
.debt .l2 { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.debt .warnline { font-size: 12.5px; color: var(--bad); }
.note { font-size: 12.5px; color: var(--muted); }
.warntext { color: var(--bad); font-size: 13.5px; font-weight: 600; }

/* Stats */
.month-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.month-nav button { border: 0; background: var(--surface); box-shadow: var(--shadow); width: 40px; height: 40px; border-radius: 10px; font-size: 18px; }
.month-nav button:disabled { opacity: .3; }
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.catrow { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.catrow:first-child { border-top: 0; }
.catrow .n { display: flex; gap: 8px; align-items: center; font-weight: 600; min-width: 0; }
.catrow .bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: visible; }
.catrow .bar > i { position: absolute; inset: 0 auto 0 0; border-radius: 3px; }
.catrow .bar > b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: .6; }
.catrow .lim { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.catrow .lim.over { color: var(--bad); font-weight: 600; }

/* Wishes */
.wish { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 12px 14px; border-top: 1px solid var(--line); align-items: center; }
.list > li:first-child .wish { border-top: 0; }
.wish .w-main { border: 0; background: transparent; text-align: left; padding: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.wish .w-name { font-weight: 700; overflow-wrap: anywhere; }
.view > p { margin: 0; }
.wish .w-when { font-size: 13px; color: var(--muted); }
.wish .w-when b { color: var(--fg); font-weight: 650; }
.wish .w-when.now b { color: var(--ok); }
.wish .w-when.never b { color: var(--bad); }
.wish .w-side { display: flex; align-items: center; gap: 2px; }
.wish .w-price { font-weight: 720; margin-right: 6px; }
.rate .v { font-size: 26px; font-weight: 780; font-stretch: 114%; letter-spacing: -.02em; }

/* Settings */
.set-row { display: grid; grid-template-columns: 1fr 120px; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.set-row:first-child { border-top: 0; }
.set-row label { font-weight: 550; }
.cat-edit { display: grid; grid-template-columns: 12px 1fr 1fr 34px; grid-template-areas: "dot name name del" ". lim home ."; gap: 8px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.cat-edit > .dot { grid-area: dot; }
.cat-edit > [data-field="cat-name"] { grid-area: name; }
.cat-edit > [data-field="cat-limit"] { grid-area: lim; }
.cat-edit > .chk { grid-area: home; }
.cat-edit > .icon-btn { grid-area: del; }
.cat-edit:first-child { border-top: 0; }
.cat-edit .dot { width: 12px; height: 12px; border-radius: 50%; }
.icon-btn { border: 0; background: transparent; color: var(--muted); font-size: 18px; width: 34px; height: 34px; border-radius: 8px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.chk input { accent-color: var(--home); width: 18px; height: 18px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* Tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); }
.tabs button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 12px; font-weight: 600; color: var(--muted); }
.tabs button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabs button[aria-current="page"] { color: var(--accent); }

/* Toast */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 12px + env(safe-area-inset-bottom, 0px)); z-index: 40; width: min(488px, calc(100% - 32px)); background: var(--fg); color: var(--bg); border-radius: 12px; padding: 11px 12px 11px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.toast.alert { background: var(--bad); color: #fff; }
.toast.alertw { background: var(--warn); color: #fff; }
.toast button { border: 0; background: transparent; color: inherit; font-weight: 750; text-decoration: underline; text-underline-offset: 3px; padding: 4px; flex: none; }

/* Sheet */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(8,10,14,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet-panel { background: var(--bg); width: 100%; max-width: 520px; border-radius: 18px 18px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom, 0px)); max-height: 88%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.sheet-panel .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); align-self: center; }
.form { display: grid; gap: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.sheet .chips { flex-wrap: wrap; overflow: visible; margin-inline: 0; padding-inline: 0; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-height: 700px) { .keypad { grid-auto-rows: 46px; } .amount .big { font-size: 40px; } .amount { min-height: 52px; } }
</style>
</head>
<body>
<div class="wrap" id="app">
  <section id="v-home" class="view">
    <div id="summary" class="summary" aria-live="polite"></div>
    <div id="banners" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="entry">
      <div class="amount" id="amount" aria-live="polite"><span class="big num is-empty">0</span><span class="cur">$</span></div>
      <div class="chips" id="chips" role="group" aria-label="Catégorie"></div>
      <div class="opts-row">
        <button class="toggle" id="homeToggle" data-act="toggle-home" aria-pressed="false"><span class="sw"></span>Faisable à la maison</button>
        <button class="link" id="optsBtn" data-act="toggle-opts" aria-expanded="false">Note, date</button>
      </div>
      <div class="opts" id="opts" hidden>
        <input class="field" id="noteIn" type="text" maxlength="80" placeholder="Note (facultatif)" autocomplete="off">
        <input class="field" id="dateIn" type="date" aria-label="Date de la dépense">
      </div>
      <div class="keypad" id="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="fn" data-k="back" aria-label="Effacer un chiffre">⌫</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="fn" data-k="," aria-label="Virgule décimale">,</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="add" id="addBtn" data-act="add" disabled>Ajouter</button>
        <button class="zero" data-k="0">0</button>
      </div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;padding-top:6px"><h2>Dernières dépenses</h2><button class="link" data-act="tab" data-tab="stats">Tout le mois</button></div>
    <div id="recent"></div>
  </section>
  <section id="v-debts" class="view" hidden></section>
  <section id="v-wishes" class="view" hidden></section>
  <section id="v-stats" class="view" hidden></section>
  <section id="v-settings" class="view" hidden></section>
</div>

<nav class="tabs" aria-label="Sections">
  <div class="tabs-in">
    <button data-act="tab" data-tab="home" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Saisie</button>
    <button data-act="tab" data-tab="debts"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Dettes</button>
    <button data-act="tab" data-tab="wishes"><svg viewBox="0 0 24 24"><path d="M12 4l2.4 5 5.4.6-4 3.7 1.1 5.4L12 16l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z"/></svg>Souhaits</button>

/* ---------- Debt payoff simulation (pure) ---------- */
// debts: [{id, bal (cents), apr (%), min (cents)}], budget in cents, method 'avalanche' | 'snowball'.
// Each month: interest accrues, minimums are paid, the rest of the budget goes to the priority debt.
// A debt's month index k means it is paid off k months after the current month.
function simulate(debts, budgetC, method) {
  const ds = debts.filter(d => d.bal > 0).map(d => ({ id: d.id, bal: d.bal / 100, r: (d.apr || 0) / 1200, apr: d.apr || 0, min: (d.min || 0) / 100, payoff: null, interest: 0 }));
  const sumMin = Math.round(ds.reduce((s, d) => s + d.min, 0) * 100);
  const res = { months: 0, payoff: {}, interest: 0, sumMin, priority: null, never: false, short: budgetC < sumMin };
  if (!ds.length) return res;
  const order = () => ds.filter(d => d.bal > 0.004).sort(method === 'snowball'
    ? (a, b) => (a.bal - b.bal) || (b.apr - a.apr)
    : (a, b) => (b.apr - a.apr) || (a.bal - b.bal));
  res.priority = order()[0].id;
  const budget = Math.max(budgetC, 0) / 100;
  let m = 0, total = 0;
  while (ds.some(d => d.bal > 0.004) && m < 600) {
    m++;
    for (const d of ds) if (d.bal > 0.004) { const i = d.bal * d.r; d.bal += i; d.interest += i; total += i; }
    let avail = budget;
    for (const d of ds) if (d.bal > 0.004) { const p = Math.min(d.min, d.bal, avail); d.bal -= p; avail -= p; }
    for (const d of order()) { if (avail <= 0.004) break; const p = Math.min(d.bal, avail); d.bal -= p; avail -= p; }
    for (const d of ds) if (d.payoff == null && d.bal <= 0.004) { d.payoff = m; d.bal = 0; }
  }
  for (const d of ds) res.payoff[d.id] = d.payoff;
  res.interest = Math.round(total * 100);
  res.never = ds.some(d => d.payoff == null);
  res.months = res.never ? null : m;
  return res;
}
// Single debt, closed form: n = -ln(1 - rB/P) / ln(1 + r)
function monthsClosedForm(balC, apr, payC) {
  const B = balC / 100, P = payC / 100, r = apr / 1200;
  if (P <= 0) return null;
  if (r === 0) return Math.ceil(B / P);
  if (P <= r * B) return null;
  return Math.ceil(-Math.log(1 - r * B / P) / Math.log(1 + r));
}

/* ---------- State ---------- */
const PALETTE = ['#2F7DD1', '#D0662F', '#8B5CC9', '#1F9E8A', '#C9A227', '#D64C7E', '#5D8A2E', '#7A8194', '#C2413B', '#3E9BB8'];

// Brings settings saved by an older version up to date.
function normalize(st) {

/* ---------- Derived data ---------- */
const catById = (id) => S.settings.cats.find(c => c.id === id) || { id, name: 'Autre', color: PALETTE[7], home: false, limit: null };
/* Budget periods: {id, start, end (inclusive, YYYY-MM-DD), amount (cents)} */
function periodFor(day) {
  return S.settings.periods.filter(p => p.start <= day && day <= p.end).sort((a, b) => b.start.localeCompare(a.start))[0] || null;
}
const activePeriod = () => periodFor(todayISO());
const periodLen = (p) => daysBetween(p.start, p.end) + 1;
// The period that follows p: same calendar-month span if p is "day d to day d-1 of next month", else same number of days.
function nextPeriod(p) {
  const s = dateOf(p.start);
  const monthly = isoOf(new Date(s.getFullYear(), s.getMonth() + 1, s.getDate() - 1)) === p.end;
  const start = addDays(p.end, 1);
  let end;
  if (monthly) { const n = dateOf(start); end = isoOf(new Date(n.getFullYear(), n.getMonth() + 1, n.getDate() - 1)); }
  else end = addDays(start, periodLen(p) - 1);
  return Object.assign({ id: 'p' + uid(), start, end, amount: p.amount }, p.ex ? { ex: true } : {});
}
// When the last period has ended, renew it (same length, same amount) until today is covered.
function rollPeriods() {
  const ps = S.settings.periods;
  if (!ps.length || activePeriod()) return false;
  const today = todayISO();
  let last = ps.slice().sort((a, b) => b.end.localeCompare(a.end))[0];
  if (last.end >= today) return false; // a future period exists but none covers today
  let n = 0;
  while (last.end < today && n < 120) { last = nextPeriod(last); ps.push(last); n++; }
  return n > 0;
}
function overlapOf(start, end, exceptId) {
  return S.settings.periods.find(p => p.id !== exceptId && p.start <= end && start <= p.end) || null;
}
const itemsIn = (p) => allItems().filter(i => { const d = dayOfItem(i); return d >= p.start && d <= p.end; });
// First day of tracking: the earliest budget period start or expense date. Stats never go before it.
function trackingStart() {
  const c = [];
  if (S.settings.periods.length) c.push(S.settings.periods.map(p => p.start).sort()[0]);
  const its = allItems(); if (its.length) c.push(its.map(dayOfItem).sort()[0]);
  return c.length ? c.sort()[0] : todayISO();
}
const itemsOf = (mk) => S.months[mk] || [];
const sumC = (arr) => arr.reduce((s, i) => s + i.amt, 0);
function allItems() { return Object.values(S.months).flat(); }
function catOrder() {
  const since = Date.now() - 90 * 864e5;
  const counts = {};
  for (const it of allItems()) if (new Date(it.ts).getTime() >= since) counts[it.cat] = (counts[it.cat] || 0) + 1;
  return S.settings.cats.map((c, i) => ({ c, i, n: counts[c.id] || 0 })).sort((a, b) => (b.n - a.n) || (a.i - b.i)).map(x => x.c);
}
function suggestCat(amtC) {

  if (amtC) { const same = items.find(i => i.amt === amtC && valid(i.cat)); if (same) return same.cat; }
  const last = items.find(i => valid(i.cat));

}
function level(total, th) { if (!th) return 0; const p = total / th; return p >= 1 ? 100 : p >= 0.8 ? 80 : 0; }

function leftoverExtra() {
  const s = S.settings;

}

}
const payoffLabel = (k) => k == null ? 'jamais à ce rythme' : monthLabel(addMonths(curMonth(), k));

/* ---------- Entry (home) ---------- */
function amtCents() {

}

  const el = $('#amount .big');

  else {
    const [i, d] = UI.amt.split(',');

}

  renderAmount();
}

    `<button class="chip" data-act="pick-cat" data-cat="${esc(c.id)}" aria-pressed="${c.id === UI.cat}"><span class="dot" style="background:${esc(c.color)}"></span>${esc(c.name)}</button>`).join('');
}

  $('#noteIn').value = ''; $('#dateIn').value = todayISO();

  const amt = amtCents();

  const dateStr = $('#dateIn').value;
  let ts;
  if (!dateStr || dateStr === todayISO()) ts = new Date().toISOString();
  else { const [y, m, d] = dateStr.split('-').map(Number); ts = new Date(y, m - 1, d, 12, 0).toISOString(); }
  const mk = monthKey(new Date(ts));

  let kind = '';

/* ---------- Home render ---------- */
function renderSummary() {
  const mk = curMonth(), today = todayISO();

  const items = per ? itemsIn(per) : itemsOf(mk), total = sumC(items), th = per ? per.amount : null;
  const homeC = sumC(items.filter(i => i.home));
  let gauge, line, label;

    const len = periodLen(per), elapsed = daysBetween(per.start, today) + 1, daysLeft = len - elapsed + 1;
    const p = total / th, cls = p >= 1 ? 'bad' : p >= 0.8 ? 'warn' : '';

    if (p >= 1) line = `<span class="st-bad">Dépassé de ${money(total - th)}</span><span class="muted mono">${daysLeft} j restants</span>`;
    else line = `<span class="${p >= 0.8 ? 'st-warn' : 'st-ok'}">Il reste ${money(th - total)}</span><span class="muted mono">${money((th - total) / daysLeft)}/jour · ${daysLeft} j</span>`;
  } else {
    label = cap(monthLabel(mk));
    gauge = `<button class="set-th" data-act="edit-th">Définir une période et un seuil</button>`;
    line = '';
  }
  const s = S.settings;
  let debtMini;
  if (s.debts.some(d => d.bal > 0)) {

function periodStatus(p) {

  else st = `<span style="color:var(--ok);font-weight:600">${cur ? 'Reste' : 'Sous le seuil de'} ${money0(p.amount - t)}</span>`;

}

/* ---------- Wish list ---------- */
// Saving capacity = what stayed under the threshold in the last finished periods (up to 6), per day.
// A fixed monthly amount set by the user overrides it.
function autoLeftover() {
  const today = todayISO();
  const done = S.settings.periods.filter(p => p.end < today).sort((a, b) => b.end.localeCompare(a.end)).slice(0, 6);
  if (!done.length) return null;
  let left = 0, days = 0;
  for (const p of done) { left += p.amount - sumC(itemsIn(p)); days += periodLen(p); }
  const perDay = left / days;
  return { perDay, monthly: Math.round(perDay * 30.4375), n: done.length };
}
function savingRate() {
  const s = S.settings;
  if (s.wishRate != null) return { perDay: s.wishRate / 30.4375, monthly: s.wishRate, source: 'fixed' };
  const a = autoLeftover();
  if (!a) return { perDay: null, monthly: null, source: 'none' };
  return Object.assign({ source: 'auto' }, a);
}
// While debts remain and the leftover goes to them, the estimated savings only start after the debts.
const wishesWaitForDebts = () => { const s = S.settings; return s.wishAfterDebts || (s.leftoverToDebt && s.wishRate == null); };
// Wishes are funded in list order: each one waits for the ones above it.
function wishPlan() {
  const s = S.settings, r = savingRate();
  const hasDebt = s.debts.some(d => d.bal > 0);
  let startDay = todayISO(), debtMonths;
  if (wishesWaitForDebts() && hasDebt) {
    debtMonths = debtSim().months;
    if (debtMonths != null) { const d = parseMonth(addMonths(curMonth(), debtMonths)); startDay = isoOf(new Date(d.getFullYear(), d.getMonth() + 1, 0)); }
  }
  let cum = 0;
  const rows = s.wishes.map(w => {
    cum += w.price;
    const need = cum - (s.wishCushion || 0);
    let when = null, state;
    if (need <= 0) state = 'now';
    else if (wishesWaitForDebts() && hasDebt && debtMonths == null) state = 'never';
    else if (r.source === 'none') state = 'unknown';
    else if (!(r.perDay > 0)) state = 'never';
    else { when = addDays(startDay, Math.ceil(need / r.perDay)); state = 'date'; }
    return { w, need, when, state };
  });
  return { r, rows, hasDebt, debtMonths };
}
function relLabel(iso) {
  const d = daysBetween(todayISO(), iso);
  if (d <= 1) return 'demain';
  if (d < 45) return `dans ${d} jours`;
  const m = Math.round(d / 30.4375);
  return m < 24 ? `dans ${m} mois` : `dans ${Math.round(m / 12)} ans`;
}
function renderWishes() {
  const s = S.settings, { r, rows, hasDebt, debtMonths } = wishPlan();
  let head = `<div class="view-head"><h1>Souhaits</h1><button class="btn" data-act="wish-new">Ajouter</button></div>`;
  let rateV, src, warn = '';
  if (r.source === 'fixed') { rateV = `≈ ${money0(r.monthly)}/mois`; src = 'Montant fixe que tu as indiqué.'; }
  else if (r.source === 'auto') {
    rateV = `≈ ${money0(Math.max(r.monthly, 0))}/mois`;
    src = `Ce qui est resté sous ton seuil, en moyenne sur ${r.n === 1 ? 'ta dernière période terminée' : 'tes ' + r.n + ' dernières périodes terminées'}.`;
    if (r.monthly <= 0) warn = `<div class="warntext">Tes dernières périodes ont dépassé le seuil : rien n'est mis de côté à ce rythme.</div>`;
  } else { rateV = '—'; src = "L'estimation commence après ta première période terminée. En attendant, tu peux indiquer un montant fixe."; }
  const extras = [];
  if (s.wishCushion) extras.push(`Déjà de côté : ${money0(s.wishCushion)}`);
  if (wishesWaitForDebts() && hasDebt) extras.push((!s.wishAfterDebts ? 'Le reste du budget va d\'abord aux dettes. ' : '') + (debtMonths != null ? `Commence après la fin des dettes (${payoffLabel(debtMonths)})` : 'Commence après la fin des dettes, qui ne se termine pas au budget actuel'));
  head += `<div class="card rate">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><h2>Épargne pour tes souhaits</h2><button class="link" data-act="wish-settings" style="padding:0">Modifier</button></div>
    <span class="v num">${rateV}</span>${warn}
    <div class="note">${esc(src)}</div>
    ${extras.length ? `<div class="note">${esc(extras.join(' · '))}</div>` : ''}
  </div>`;
  if (!rows.length) {
    $('#v-wishes').innerHTML = head + `<div class="empty">Ajoute ce que tu aimerais t'acheter. Expy estime quand tu pourras le payer comptant, d'après ce qui reste sous ton seuil à chaque période.</div>`;
    return;
  }
  const li = rows.map(({ w, when, state }, i) => {

function sheetPeriod(id) {

    else { const d = new Date(); start = isoOf(new Date(d.getFullYear(), d.getMonth(), 1)); end = isoOf(new Date(d.getFullYear(), d.getMonth() + 1, 0)); amount = last ? last.amount : null; }

      : ov ? `Ces dates chevauchent la période du ${shortDate(ov.start, true)} au ${shortDate(ov.end, true)}. Modifie-la ou change les dates.` : '';
    if (err) { $('#perErr').textContent = err; $('#perErr').hidden = false; return; }

      const amt = parseMoney($('#pAmt').value);
      if (amt == null || isNaN(amt) || amt <= 0) { $('#pAmt').focus(); return; }
      d.bal = Math.max(0, d.bal - amt); d.updated = new Date().toISOString();
      S.settings.payments.push({ id: uid(), debtId: d.id, amt, date: $('#pDate').value || todayISO() });
      persist('settings'); closeSheet(); rerender();
      toast(`Paiement de ${money(amt)} déduit · solde ${money(d.bal)}`);
    });
    $('#dDel').addEventListener('click', () => {
      if (UI.confirm !== 'ddel') { UI.confirm = 'ddel'; $('#dDel').textContent = 'Confirmer la suppression'; return; }
      S.settings.debts = S.settings.debts.filter(x => x.id !== d.id);
      S.settings.payments = S.settings.payments.filter(p => p.debtId !== d.id);
      persist('settings'); closeSheet(); rerender();
    });
  }
}

// End-of-period check-in: recap of the period, then the balance of each debt today.
// A lower balance is logged as a payment; a higher one just updates the balance (new charges).
function sheetReview(pid) {
  const s = S.settings, p = s.periods.find(x => x.id === pid);
  if (!p) return;
  const spent = sumC(itemsIn(p)), left = p.amount - spent;
  const active = s.debts.filter(d => d.bal > 0);
  const prio = debtSim().priority;
  const pd = active.find(d => d.id === prio) || active[0];
  openSheet(`<h1>Fin de période</h1>
    <div class="card"><div class="kv">
      <div><span class="k">Dépensé</span><span class="v num">${money0(spent)}</span></div>
      <div><span class="k">Seuil</span><span class="v num">${money0(p.amount)}</span></div>
      <div><span class="k">${left >= 0 ? 'Reste' : 'Dépassé'}</span><span class="v num" style="color:${left >= 0 ? 'var(--ok)' : 'var(--bad)'}">${money0(Math.abs(left))}</span></div>
    </div><div class="note">Du ${esc(shortDate(p.start, true))} au ${esc(shortDate(p.end, true))}.</div></div>
    <form class="form" id="rvForm">
      <div class="note">Indique le solde de chaque dette aujourd'hui, d'après ton relevé ou ton appli bancaire.</div>
      ${active.map(d => `<label>${esc(d.name)} · solde avant : ${money(d.bal)}<input class="field num" id="rv-${esc(d.id)}" data-debt="${esc(d.id)}" inputmode="decimal" value="${esc(toInputMoney(d.bal))}"></label>`).join('')}
      ${left > 0 && pd ? `<button type="button" class="btn ghost" id="rvApply">Déduire les ${money0(left)} restants de ${esc(pd.name)}</button>` : ''}
      <div class="warntext" id="rvErr" hidden></div>
      <button class="btn block" type="submit">Enregistrer les soldes</button>
      <button class="btn ghost block" type="button" id="rvNone">Rien à changer</button>
    </form>`);
  if (left > 0 && pd) $('#rvApply').addEventListener('click', () => {
    const f = $('#rv-' + pd.id); f.value = toInputMoney(Math.max(0, pd.bal - left));
  });
  const done = (msg) => { s.reviewed[p.id] = new Date().toISOString(); persist(); closeSheet(); rerender(); if (msg) toast(msg); };
  $('#rvNone').addEventListener('click', () => done(''));
  $('#rvForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const vals = [];
    for (const d of active) {
      const v = parseMoney($('#rv-' + d.id).value);
      if (v == null || isNaN(v)) { $('#rvErr').textContent = `Indique le solde de ${d.name} (0 si payée au complet).`; $('#rvErr').hidden = false; return; }
      vals.push([d, v]);
    }
    let paid = 0;
    for (const [d, v] of vals) {
      if (v < d.bal) { s.payments.push({ id: uid(), debtId: d.id, amt: d.bal - v, date: todayISO(), note: 'Fin de période' }); paid += d.bal - v; }
      if (v !== d.bal) { d.bal = v; d.updated = new Date().toISOString(); }
    }
    const sim = debtSim();
    done(`Soldes à jour${paid ? ` · ${money0(paid)} remboursés` : ''}${s.debts.some(d => d.bal > 0) ? ' · libre en ' + payoffLabel(sim.months) : ' · plus de dettes'}`);
  });
}

/* ---------- Toast ---------- */
function toast(msg, undo, kind = '') {
  const t = $('#toast');
  clearTimeout(UI.toastTimer);
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" id="undoBtn">Annuler</button>' : ''}`;
  t.hidden = false;
  if (undo) $('#undoBtn').onclick = () => { undo(); t.hidden = true; clearTimeout(UI.toastTimer); };
  UI.toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 5000 : 3000);
}

/* ---------- Export / import ---------- */
function csvCell(v) { const s = String(v ?? ''); return /[;"\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
async function save(filename, data) {
  if (!S.dl) return false;
  try { await S.dl.save({ filename, data }); S.settings.lastExport = new Date().toISOString(); persist('settings'); rerender(); toast('Fichier enregistré'); return true; }
  catch (e) { if (e && e.code === 'declined') return false; toast(e && e.code === 'rate_limited' ? 'Un enregistrement est déjà en cours.' : "L'export n'a pas pu se faire ici."); return false; }
}
function exportCSV() {
  const rows = [['date', 'montant', 'categorie', 'faisable_maison', 'note']];
  allItems().sort((a, b) => a.ts.localeCompare(b.ts)).forEach(i => {
    const d = new Date(i.ts);
    rows.push([d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), (i.amt / 100).toFixed(2).replace('.', ','), catById(i.cat).name, i.home ? 'oui' : 'non', i.note || '']);
  });
  save(`depenses-${todayISO()}.csv`, '﻿' + rows.map(r => r.map(csvCell).join(';')).join('\r\n'));
}
function exportJSON() {
  save(`budget-sauvegarde-${todayISO()}.json`, JSON.stringify({ app: 'budget-perso-express', v: 1, exported: new Date().toISOString(), settings: S.settings, months: S.months }, null, 1));
}
$('#importIn').addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0]; e.target.value = '';
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (err) { toast("Ce fichier n'est pas une sauvegarde valide."); return; }
  if (!data || data.app !== 'budget-perso-express' || !data.settings || typeof data.months !== 'object') { toast("Ce fichier n'est pas une sauvegarde de Budget perso express."); return; }
  const n = Object.values(data.months).flat().length;
  openSheet(`<h1>Restaurer la sauvegarde ?</h1><p class="note">Le fichier contient ${n} dépenses et ${(data.settings.debts || []).length} dettes. Il remplace toutes les données actuelles.</p>
    <button class="btn block" id="impOk">Remplacer mes données</button><button class="btn ghost block" data-act="close-sheet">Annuler</button>`);
  $('#impOk').onclick = () => {
    const oldKeys = Object.keys(S.months).map(mKey);
    S.settings = normalize(data.settings);
    S.months = data.months;
    persist('settings', ...new Set([...oldKeys, ...Object.keys(S.months).map(mKey)]));
    closeSheet(); resetEntry(); rerender(); toast('Sauvegarde restaurée');
  };
});

/* ---------- Example data ---------- */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function loadDemo() {
  const r = rng(42), s = S.settings, cm = curMonth(), now = new Date();
  const pattern = [['cafe', 4.75, true, 'Allongé'], ['epicerie', 86.4, false, ''], ['restaurant', 32.5, true, 'Lunch'], ['transport', 3.75, false, 'STM'], ['cafe', 5.25, true, ''], ['maison', 24.99, false, ''], ['epicerie', 54.1, false, ''], ['restaurant', 61.0, true, 'Livraison'], ['loisirs', 28.0, false, 'Cinéma'], ['livres', 24.95, false, ''], ['jeux', 34.99, false, ''], ['autre', 18.0, false, '']];
  const touched = new Set();
  for (let m = 5; m >= 0; m--) {
    const mk = addMonths(cm, -m), d0 = parseMonth(mk);
    const lastDay = m === 0 ? now.getDate() : daysInMonth(d0);
    const n = m === 0 ? Math.max(4, Math.round(lastDay * 1.4)) : 38 + Math.floor(r() * 10);
    for (let i = 0; i < n; i++) {
      const p = pattern[Math.floor(r() * pattern.length)];
      const day = 1 + Math.floor(r() * lastDay);
      const ts = new Date(d0.getFullYear(), d0.getMonth(), day, 8 + Math.floor(r() * 12), Math.floor(r() * 60));
      if (ts > now) ts.setTime(now.getTime() - 3600e3 * (1 + i));
      const amt = Math.round(p[1] * (0.7 + r() * 0.6) * 100);
      (S.months[mk] = S.months[mk] || []).push({ id: uid(), amt, cat: p[0], ts: ts.toISOString(), home: p[2], note: p[3], ex: true });
    }
    touched.add(mKey(mk));
  }
  if (!s.periods.length) {
    // Pay-to-pay periods (the 15th to the 14th), so the example shows dates that differ from calendar months.
    let p = { id: 'p' + uid(), start: isoOf(new Date(now.getFullYear(), now.getMonth() - 6, 15)), end: isoOf(new Date(now.getFullYear(), now.getMonth() - 5, 14)), amount: 160000, ex: true };
    s.periods.push(p);
    while (p.end < todayISO()) { p = Object.assign(nextPeriod(p), { ex: true }); s.periods.push(p); }
  }
  s.debts.push({ id: uid(), name: 'Visa', bal: 480000, apr: 20.99, min: 15000, updated: new Date().toISOString(), ex: true });
  s.debts.push({ id: uid(), name: 'Marge de crédit', bal: 250000, apr: 9.5, min: 7500, updated: new Date().toISOString(), ex: true });
  if (s.debtBudget < 50000) s.debtBudget = 50000;
  s.wishes.push({ id: 'w' + uid(), name: 'Casque audio', price: 34900, added: todayISO(), ex: true });
  s.wishes.push({ id: 'w' + uid(), name: 'Fin de semaine à Québec', price: 60000, added: todayISO(), ex: true });
  persist('settings', ...touched);
  resetEntry(); rerender();
}
function clearDemo() {
  const s = S.settings, keys = ['settings'];
  for (const [mk, arr] of Object.entries(S.months)) if (arr.some(i => i.ex)) { S.months[mk] = arr.filter(i => !i.ex); keys.push(mKey(mk)); }
  const exIds = s.debts.filter(d => d.ex).map(d => d.id);
  s.debts = s.debts.filter(d => !d.ex);
  s.payments = s.payments.filter(p => !exIds.includes(p.debtId));
  s.periods = s.periods.filter(p => !p.ex);
  s.wishes = s.wishes.filter(w => !w.ex);
  if (!s.debts.length) s.debtBudget = 0;
  persist(...keys); resetEntry(); rerender(); toast("Données d'exemple effacées");
}

/* ---------- Navigation & events ---------- */
function showTab(tab) {
  UI.tab = tab;
  for (const v of ['home', 'debts', 'wishes', 'stats', 'settings']) $('#v-' + v).hidden = tab !== v;
  document.querySelectorAll('.tabs [data-tab]').forEach(b => { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  rerender();
  window.scrollTo(0, 0);
}
function rerender() {
  if (rollPeriods()) persist('settings');
  if (UI.tab === 'home') renderHome();
  else if (UI.tab === 'debts') renderDebts();
  else if (UI.tab === 'stats') renderStats();
  else if (UI.tab === 'wishes') renderWishes();
  else renderSettings();
}
document.addEventListener('click', (e) => {
  const k = e.target.closest('[data-k]');
  if (k) { key(k.dataset.k); return; }
  const t = e.target.closest('[data-act]');
  if (e.target === $('#sheet')) { closeSheet(); return; }
  if (!t) return;
  const a = t.dataset.act;
  switch (a) {
    case 'add': addExpense(); break;
    case 'pick-cat': UI.cat = t.dataset.cat; UI.catPicked = true; if (!UI.homePicked) UI.home = !!catById(UI.cat).home; renderChips(); renderHomeToggle(); break;
    case 'toggle-home': UI.home = !UI.home; UI.homePicked = true; renderHomeToggle(); break;
    case 'toggle-opts': UI.optsOpen = !UI.optsOpen; $('#opts').hidden = !UI.optsOpen; t.setAttribute('aria-expanded', String(UI.optsOpen)); break;
    case 'tab': showTab(t.dataset.tab); break;
    case 'edit-th': { const ap = activePeriod(); sheetPeriod(ap ? ap.id : null); break; }
    case 'period-new': sheetPeriod(null); break;
    case 'wish-new': sheetWish(null); break;
    case 'review': sheetReview(t.dataset.id); break;
    case 'review-later': { const rv = pendingReview(); if (rv) UI.reviewLater = rv.id; renderBanners(); break; }
    case 'wish-edit': sheetWish(t.dataset.id); break;
    case 'wish-settings': sheetWishSettings(); break;
    case 'wish-move': {
      const ws = S.settings.wishes, i = ws.findIndex(x => x.id === t.dataset.id), j = i + Number(t.dataset.d);
      if (i < 0 || j < 0 || j >= ws.length) break;
      [ws[i], ws[j]] = [ws[j], ws[i]]; persist(); renderWishes(); break;
    }
    case 'period-edit': sheetPeriod(t.dataset.id); break;
    case 'edit-item': sheetItem(t.dataset.id); break;
    case 'debt-new': sheetDebt(null); break;
    case 'debt-edit': sheetDebt(t.dataset.id); break;
    case 'method': S.settings.method = t.dataset.m; persist('settings'); renderDebts(); break;
    case 'month': UI.statsMonth = addMonths(UI.statsMonth, Number(t.dataset.d)); renderStats(); break;
    case 'cat-add': {
      const name = $('#newCat').value.trim(); if (!name) { $('#newCat').focus(); return; }
      const used = new Set(S.settings.cats.map(c => c.color));
      S.settings.cats.push({ id: 'c' + uid(), name, color: PALETTE.find(p => !used.has(p)) || PALETTE[S.settings.cats.length % PALETTE.length], limit: null, home: false });
      persist('settings'); renderSettings(); break;
    }
    case 'cat-del': {
      if (UI.confirm !== 'cat:' + t.dataset.id) { UI.confirm = 'cat:' + t.dataset.id; t.textContent = 'OK ?'; t.style.fontSize = '12px'; t.style.color = 'var(--bad)'; return; }
      S.settings.cats = S.settings.cats.filter(c => c.id !== t.dataset.id); UI.confirm = null;
      persist('settings'); renderSettings(); break;
    }
    case 'export-csv': exportCSV(); break;
    case 'export-json': exportJSON(); break;
    case 'import': $('#importIn').click(); break;
    case 'load-demo': loadDemo(); break;
    case 'clear-demo': clearDemo(); break;
    case 'close-sheet': closeSheet(); break;
    case 'install': if (UI.installEvt) { const ev = UI.installEvt; ev.prompt(); ev.userChoice.finally(() => { UI.installEvt = null; rerender(); }); } break;
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'budgetRange') previewBudget(Number(e.target.value));
});
document.addEventListener('change', (e) => {
  const el = e.target, f = el.dataset && el.dataset.field, s = S.settings;
  if (el.id === 'budgetRange') { s.debtBudget = Number(el.value); persist('settings'); renderDebts(); return; }
  if (el.id === 'leftoverToggle') { s.leftoverToDebt = el.checked; persist('settings'); renderDebts(); return; }
  if (!f) return;
  {
    const c = s.cats.find(x => x.id === el.dataset.id); if (!c) return;
    if (f === 'cat-name') { const n = el.value.trim(); if (n) c.name = n; else el.value = c.name; }
    if (f === 'cat-limit') { const v = parseMoney(el.value); c.limit = (v == null || isNaN(v) || v <= 0) ? null : v; }
    if (f === 'cat-home') c.home = el.checked;
    persist('settings');
  }
});
document.addEventListener('keydown', (e) => {
  if (UI.tab !== 'home' || !$('#sheet').hidden) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (/^[0-9]$/.test(e.key)) { key(e.key); e.preventDefault(); }
  else if (e.key === ',' || e.key === '.') { key(','); e.preventDefault(); }
  else if (e.key === 'Backspace') { key('back'); e.preventDefault(); }
  else if (e.key === 'Enter' && amtCents() > 0) { addExpense(); e.preventDefault(); }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) rerender(); });

/* ---------- Boot ---------- */
applyCache(loadCache());
resetEntry();
const HASH_TABS = { '#dettes': 'debts', '#souhaits': 'wishes', '#stats': 'stats', '#reglages': 'settings' };
showTab(HASH_TABS[location.hash] || 'home');
window.addEventListener('hashchange', () => { if (HASH_TABS[location.hash]) showTab(HASH_TABS[location.hash]); });
connect().then(() => { resetEntry(); rerender(); });

window.__budget = { simulate, monthsClosedForm, S, UI, normalize, rollPeriods, nextPeriod, activePeriod, trackingStart, savingRate, wishPlan, persist, rerender, debtSim, autoLeftover, pendingReview };
})();
</script>
